name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build -v
      - name: Test (Core + WKWebView + CLI)
        run: swift test -v

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show available iOS Simulator destinations
        run: xcodebuild -showsdks
      - name: Compile SwiftPWAWebKit for iOS Simulator
        # Use xcodebuild against the SwiftPM workspace because Apple
        # does not ship an iOS Swift SDK that `swift build --triple`
        # can target directly. We build the umbrella `SwiftPWA` library
        # via the SwiftPWA scheme on a generic iOS Simulator destination.
        run: |
          xcodebuild \
            -scheme SwiftPWA \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build/ios-sim \
            build

  linux-gtk3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Show Swift version
        run: swift --version
      - name: Install GTK3 + WebKitGTK 4.1 + libayatana-appindicator3
        # Required so SwiftPM's package graph resolution doesn't fail
        # on the pkgConfig declarations for the GTK system-library targets,
        # even when SwiftPWAGTK itself isn't built into the test executable.
        # `libayatana-appindicator3-dev` was added when the tray plugin
        # landed — without it the C shim's `<libayatana-appindicator/...>`
        # include fails resolution.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb
      - name: Build Core + CLI
        # GTK backend builds are scaffolded but require additional
        # debugging on a real Linux box (see docs/linux-setup.md);
        # we don't gate CI on them yet.
        run: swift build --target SwiftPWACore --target swift-pwa-cli
      - name: Test Core + CLI
        run: swift test --filter SwiftPWACoreTests --filter SwiftPWACLITests

  linux-gtk4:
    runs-on: ubuntu-24.04
    env:
      SWIFT_PWA_GTK4: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Show Swift version
        run: swift --version
      - name: Install GTK4 + WebKitGTK 6.0
        # `SWIFT_PWA_GTK4=1` swaps the package graph to use the GTK4 /
        # WebKitGTK 6.0 system-library targets; pkgConfig resolution
        # needs the matching dev packages installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            xvfb
      - name: Build Core + CLI
        run: swift build --target SwiftPWACore --target swift-pwa-cli
      - name: Test Core + CLI
        run: swift test --filter SwiftPWACoreTests --filter SwiftPWACLITests

  windows:
    runs-on: windows-latest
    # The Windows backend (`SwiftPWAWindows` + `CWebView2Shim`) needs:
    #   1. Swift for Windows (compnerd's action — `swift-actions/setup-swift`
    #      doesn't cover Windows last we checked).
    #   2. Visual Studio Build Tools for the MSVC CRT (preinstalled on
    #      windows-latest, but `LIB` only picks up the right arch after
    #      `Launch-VsDevShell.ps1` runs).
    #   3. NuGet packages for WebView2 SDK headers / static loader and
    #      WIL headers.
    # Everything after the toolchain install lives in a single step
    # because each PowerShell `run:` is a fresh shell — the dev-shell
    # exports and INCLUDE/LIB tweaks don't persist across steps.
    steps:
      - uses: actions/checkout@v5
      - name: Set up Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.0.3-release
          tag: 6.0.3-RELEASE
      - run: swift --version
      - name: Install WebView2 SDK + WIL (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Build (release) + run cross-platform tests
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:INCLUDE = "$pwd\packages\Microsoft.Web.WebView2\build\native\include;" +
                         "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include;" +
                         "$env:INCLUDE"
          $env:LIB = "$pwd\packages\Microsoft.Web.WebView2\build\native\x64;$env:LIB"
          swift build -c release
          # Only the cross-platform suites; SwiftPWAWindowsTests is a
          # placeholder until we add Windows-specific runtime tests.
          swift test --filter SwiftPWACoreTests --filter SwiftPWACLITests

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install swiftformat
        run: brew install swiftformat
      - name: Lint
        run: swiftformat --lint .
