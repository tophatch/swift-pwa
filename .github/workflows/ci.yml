name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the opt-in jobs below (simulator-drive, driven-input, oauth,
    # and the next-toolchain canaries) — too slow, or too dependent on a real
    # environment, to gate a PR on, but they shouldn't rot unwatched either.
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build -v
      # `swift test` only ever builds debug, so a symbol that exists only in a
      # debug build — anything behind `#if SWIFT_PWA_DRIVER` — can be depended
      # on by shipping code and still go green. That happened: the agent
      # surface, which ships in release, used a helper defined in the driver's
      # own file. ~1 min, and it covers Core + the Apple backend + the CLI,
      # which is where every driver-gated file lives today.
      - name: Build (release — catches debug-only gating)
        run: swift build -c release -v
      - name: Test (Core + WKWebView + CLI)
        run: swift test -v

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show available iOS Simulator destinations
        run: xcodebuild -showsdks
      - name: Compile SwiftPWAWebKit for iOS Simulator
        # Use xcodebuild against the SwiftPM workspace because Apple
        # does not ship an iOS Swift SDK that `swift build --triple`
        # can target directly. We build the umbrella `SwiftPWA` library
        # via the SwiftPWA scheme on a generic iOS Simulator destination.
        run: |
          xcodebuild \
            -scheme SwiftPWA \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build/ios-sim \
            build

  bundle-smoke:
    # Does a bundled app actually run somewhere other than the machine that
    # built it? Nothing checked that until 0.9.10, and the answer was no: the
    # runtime read `bridge.js` from a SwiftPM resource bundle, whose generated
    # accessor points at an absolute path inside `.build/`. Every `.app` we and
    # our adopters shipped hard-crashed on launch on anyone else's Mac, through
    # a fully green CI.
    #
    # So: scaffold a *fresh* app (not an Example — those carry fallbacks the
    # scaffold never emits), bundle it, delete `.build`, move it, and drive the
    # result. ~1 minute, and it fails on exactly the regression that shipped.
    # (The simulator counterpart is the `simulator-drive` job below, which is
    # opt-in — see the comment there.)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the CLI
        run: swift build --product swift-pwa
      - name: Scaffold an app against this checkout
        run: |
          mkdir -p /tmp/bundle-smoke
          cd /tmp/bundle-smoke
          "$GITHUB_WORKSPACE/.build/debug/swift-pwa" init BundleSmoke --path app
          cd app
          # The scaffold depends on the released swift-pwa; point it at the
          # commit under test.
          sed -i '' -e 's|\.package(url: "https://github.com/tophatch/swift-pwa", from: "[^"]*")|.package(path: "'"$GITHUB_WORKSPACE"'")|' Package.swift
          grep -n 'package(path' Package.swift
      - name: Bundle a debug .app (debug so the driver is compiled in)
        working-directory: /tmp/bundle-smoke/app
        run: "$GITHUB_WORKSPACE/.build/debug/swift-pwa build --target macos --configuration debug"
      - name: Delete .build, then drive the .app
        working-directory: /tmp/bundle-smoke/app
        run: |
          set -euo pipefail
          rm -rf .build
          cp -R "build/macos/BundleSmoke.app" /tmp/Relocated.app
          SWIFT_PWA_DRIVE=0 /tmp/Relocated.app/Contents/MacOS/BundleSmoke > /tmp/app.log 2>&1 &
          for _ in $(seq 1 60); do grep -q "driver listening" /tmp/app.log && break; sleep 1; done
          cat /tmp/app.log
          PORT=$(sed -n 's/.*port=\([0-9]*\).*/\1/p' /tmp/app.log | head -1)
          TOKEN=$(sed -n 's/.*token=\([0-9a-f]*\).*/\1/p' /tmp/app.log | head -1)
          test -n "$PORT" || (echo "the relocated .app never announced a driver port — it died on launch" && exit 1)
          # `typeof __SWIFT_PWA__` is the assertion that matters: it's "object"
          # only if bridge.js was found and injected.
          OUT=$("$GITHUB_WORKSPACE/.build/debug/swift-pwa" drive eval --attach "$PORT" --token "$TOKEN" \
            "typeof __SWIFT_PWA__")
          echo "$OUT"
          echo "$OUT" | grep -q object
          # A promise-shaped script, because every other `drive eval` in this
          # file is synchronous — so without this a green run says nothing about
          # whether awaiting works. The delay is deliberate: it forces at least
          # one poll to come back pending, exercising the park-on-a-global and
          # read-it-back path rather than a promise that's already settled.
          OUT=$("$GITHUB_WORKSPACE/.build/debug/swift-pwa" drive eval --attach "$PORT" --token "$TOKEN" \
            "new Promise(r => setTimeout(() => r('awaited'), 250))")
          echo "$OUT"
          echo "$OUT" | grep -q awaited
          # Don't leave it running — the job's cleanup reports it as an orphan,
          # which is noise in the log of the next thing that goes wrong.
          pkill -x BundleSmoke || true

  bundle-smoke-linux:
    # The same question on Linux, and it went unasked for far longer: the two
    # GTK jobs compile the backend and run tests, but **nothing in CI had ever
    # bundled an AppImage**. Both of the bugs that shipped would have failed
    # here — an AppImage that read `bridge.js` out of the build machine's
    # `.build/` (0.9.10), and `build --target linux` never returning at all,
    # because `linuxdeploy` self-mounts over FUSE and left us waiting on a
    # zombie with the finished artifact already on disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          # Same floor as the GTK jobs — see the note there.
          swift-version: "6.2"
      - name: Install GTK3 + WebKitGTK 4.1 + libayatana-appindicator3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb
      - name: Install linuxdeploy + the appimage plugin
        # The same two URLs docs/linux-setup.md tells adopters to use. Both are
        # themselves AppImages, and a hosted runner has no FUSE — which is fine,
        # because the CLI runs them with APPIMAGE_EXTRACT_AND_RUN=1 (see
        # AppImageBundler). If that ever regresses, this job hangs and its
        # timeout says so.
        run: |
          sudo wget -q -O /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo wget -q -O /usr/local/bin/linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-appimage
      - name: Build the CLI
        run: swift build --product swift-pwa
      - name: Scaffold an app against this checkout
        run: |
          mkdir -p /tmp/bundle-smoke
          cd /tmp/bundle-smoke
          "$GITHUB_WORKSPACE/.build/debug/swift-pwa" init BundleSmoke --path app
          cd app
          # The scaffold depends on the released swift-pwa; point it at the
          # commit under test. (GNU sed — no empty argument after -i.)
          sed -i -e 's|\.package(url: "https://github.com/tophatch/swift-pwa", from: "[^"]*")|.package(path: "'"$GITHUB_WORKSPACE"'")|' Package.swift
          grep -n 'package(path' Package.swift
      - name: Bundle a debug AppImage (debug so the driver is compiled in)
        working-directory: /tmp/bundle-smoke/app
        run: "$GITHUB_WORKSPACE/.build/debug/swift-pwa build --target linux --configuration debug"
      - name: Delete .build, then drive the relocated AppImage
        working-directory: /tmp/bundle-smoke/app
        run: |
          set -euo pipefail
          rm -rf .build
          mv build/linux/BundleSmoke-x86_64.AppImage /tmp/Relocated.AppImage
          # Extract-and-run for the same no-FUSE reason; a display because the
          # app is a real GTK app. Both are about the runner, not the bundle:
          # what's under test is that the AppImage carries everything it needs.
          cd /tmp
          APPIMAGE_EXTRACT_AND_RUN=1 SWIFT_PWA_DRIVE=0 \
            xvfb-run -a /tmp/Relocated.AppImage > /tmp/app.log 2>&1 &
          for _ in $(seq 1 60); do grep -q "driver listening" /tmp/app.log && break; sleep 1; done
          cat /tmp/app.log
          PORT=$(sed -n 's/.*port=\([0-9]*\).*/\1/p' /tmp/app.log | head -1)
          TOKEN=$(sed -n 's/.*token=\([0-9a-f]*\).*/\1/p' /tmp/app.log | head -1)
          test -n "$PORT" || (echo "the relocated AppImage never announced a driver port — it died on launch" && exit 1)
          # "object" only if bridge.js was found and injected.
          OUT=$("$GITHUB_WORKSPACE/.build/debug/swift-pwa" drive eval --attach "$PORT" --token "$TOKEN" \
            "typeof __SWIFT_PWA__")
          echo "$OUT"
          echo "$OUT" | grep -q object
          # See the macOS job: the one promise-shaped assertion in the file, and
          # the only thing here that covers `drive eval` awaiting at all. Worth
          # having on both desktop backends, since the await is client-side and
          # WebKitGTK is the backend that surfaced the bug.
          OUT=$("$GITHUB_WORKSPACE/.build/debug/swift-pwa" drive eval --attach "$PORT" --token "$TOKEN" \
            "new Promise(r => setTimeout(() => r('awaited'), 250))")
          echo "$OUT"
          echo "$OUT" | grep -q awaited
          pkill -x BundleSmoke || true

  # `drive --simulator`, on demand (workflow_dispatch) or weekly — NOT on every
  # PR. Not because it's broken any more (the stall was an undrained pipe in the
  # CLI, fixed, and it passes in ~5 minutes now) but because it isn't where the
  # risk is: an iPad *device* is what we actually need to be sure about, and a
  # simulator can't stand in for one. So it stays a scheduled canary, and the
  # per-PR gate is the two `bundle-smoke` jobs above.
  #
  # Note the shape of the run: stdout goes to a file and stderr flows straight to
  # the job log, so a killed job still shows which phase it reached. Capturing
  # stderr into a file that's only tailed afterwards is why the first two stalls
  # logged nothing at all.
  simulator-drive:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build the CLI
        run: swift build --product swift-pwa
      - name: Scaffold an app against this checkout
        run: |
          mkdir -p /tmp/sim-drive
          cd /tmp/sim-drive
          "$GITHUB_WORKSPACE/.build/debug/swift-pwa" init SimDrive --path app
          cd app
          sed -i '' -e 's|\.package(url: "https://github.com/tophatch/swift-pwa", from: "[^"]*")|.package(path: "'"$GITHUB_WORKSPACE"'")|' Package.swift
      # `simctl list runtimes -j` is the query that deadlocked `Shell.capture`
      # (a pipe drained only after `waitUntilExit`, so anything over 64 KiB
      # wedged forever). These byte counts are the evidence for whether a future
      # stall here is the same shape — the shell drains properly, so measuring
      # is safe even when the CLI wasn't.
      - name: Record the runner's simctl surface
        run: |
          xcrun simctl list runtimes
          echo "runtimes -j:          $(xcrun simctl list runtimes -j | wc -c) bytes"
          echo "devices available -j: $(xcrun simctl list devices available -j | wc -c) bytes"
      - name: Drive it on the iOS Simulator
        working-directory: /tmp/sim-drive/app
        run: |
          set -euo pipefail
          xcrun simctl list devices available | head -20
          "$GITHUB_WORKSPACE/.build/debug/swift-pwa" drive eval --simulator \
            "typeof __SWIFT_PWA__" > /tmp/sim-out.txt
          cat /tmp/sim-out.txt
          grep -q object /tmp/sim-out.txt

  # Keyboard, editing and drag against a *running* app — on demand
  # (workflow_dispatch) or weekly, not on every PR.
  #
  # Why it exists: every keyboard fix in #163 was verified by hand on real
  # hardware while CI only ever *compiled* these backends, so all of them could
  # regress silently (#164). This drives a real app through the behaviours that
  # only a driven run can check.
  #
  # Linux only here, and that is a deliberate limit rather than an oversight.
  # The GTK3 runner is the one hosted environment that can do this: Xvfb gives
  # it a display with no input device at all, which both backends' synthetic
  # input works under. macOS can't — the editing shortcuts are main-menu key
  # equivalents needing a key window, and a hosted runner has no logged-in
  # desktop, so the script would correctly skip every one of them. Windows has
  # its own PowerShell sibling to be run on a box with an interactive session.
  driven-input:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK, WebKitGTK and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb
      - name: Drive a real app
        env:
          # Headless WebKitGTK needs its compositing and sandbox off, the same
          # way the GUI-gated suites do; the CRITICAL lines it prints without
          # them are noise, not failures.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: bash Scripts/verify-driven-input.sh

  # An OAuth flow is three mechanisms wearing one command — a URL handed to the
  # system browser, an HTTP listener on 127.0.0.1, and a `state` check — and the
  # unit suite can only reach the one that doesn't involve another process. Every
  # gating job compiles the backends and launches nothing, which is how `drive`
  # and the agent check both turned out never to have worked on Windows.
  #
  # Linux only, and off the PR gate, for the same reasons as `driven-input`: this
  # needs a real browser on a real display, which Xvfb plus the runner image's
  # Chrome provides and a hosted macOS or Windows runner does not (no logged-in
  # desktop). The mobile halves can't run hosted at all — they need a cabled
  # device — so `verify-oauth-android.sh` / `-ios.sh` stay manual.
  #
  # `--require-browser` is load-bearing. Without it the script SKIPs when it
  # can't reach a browser, which is right for a developer on a headless box and
  # catastrophic here: the job would report green having tested nothing, which is
  # precisely the failure its own controls exist to prevent.
  oauth:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK, WebKitGTK, Xvfb and the desktop-entry tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb \
            xdg-utils \
            desktop-file-utils
      - name: Register a URL handler the runner can actually run
        # **This is a fetcher, not a browser, and that is deliberate.** A hosted
        # runner cannot reliably run a GUI browser: the image ships Chrome but
        # registers no default handler, and Ubuntu 24.04's AppArmor restriction
        # on unprivileged user namespaces breaks its sandbox — `g_app_info_…`
        # reports a *successful spawn* and the browser then dies, so the flow
        # fails as "no browser on this box" while everything is registered
        # correctly. Both of those were measured here, in that order.
        #
        # What this still exercises is the whole chain that can regress in *our*
        # code: `system.openURL` → `ExternalURLPolicy` → `GTKURLOpener` → GIO's
        # default-handler resolution → a spawned process receiving the URL, and
        # then the real loopback receiver, `state` check, PKCE round-trip and
        # timeout. What it does not exercise is a browser *rendering* a consent
        # page — so a green run here is not evidence that a real browser works.
        # That is what the desktop and device runs in docs/auth.md are for.
        run: |
          set -euo pipefail
          sudo tee /usr/local/bin/swift-pwa-ci-open >/dev/null <<'SH'
          #!/usr/bin/env bash
          exec curl -sS -L -o /dev/null --max-time 30 "$1"
          SH
          sudo chmod +x /usr/local/bin/swift-pwa-ci-open
          mkdir -p ~/.local/share/applications
          cat > ~/.local/share/applications/swift-pwa-ci-open.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=swift-pwa CI URL handler
          Exec=/usr/local/bin/swift-pwa-ci-open %u
          Terminal=false
          NoDisplay=true
          MimeType=x-scheme-handler/http;x-scheme-handler/https;
          DESKTOP
          update-desktop-database ~/.local/share/applications
          xdg-settings set default-web-browser swift-pwa-ci-open.desktop
          xdg-settings get default-web-browser
      - name: Preflight — can this runner hand a URL to its handler at all?
        # Deliberately the same path the app takes (GIO → the registered handler
        # → loopback), minus the app. Without it a red CONTROL line in the next
        # step is ambiguous between "the runner's handler is broken" and "the
        # feature regressed", which is the one distinction whoever reads the
        # tracking issue needs first. It has already paid for itself once.
        run: |
          set -euo pipefail
          python3 -m http.server 8731 --bind 127.0.0.1 >/tmp/preflight.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          gio open "http://127.0.0.1:8731/preflight" || true
          for _ in $(seq 1 60); do
            grep -q "GET /preflight" /tmp/preflight.log && break
            sleep 0.5
          done
          grep -q "GET /preflight" /tmp/preflight.log || {
            echo "::error::the registered handler never fetched the preflight URL — the runner, not the code"
            cat /tmp/preflight.log
            exit 1
          }
          echo "the registered handler fetched the preflight URL"
      - name: Run a whole authorization-code flow against a stand-in provider
        env:
          # Headless WebKitGTK needs its compositing and sandbox off, the same
          # way the GUI-gated suites do; the CRITICAL lines it prints without
          # them are noise, not failures.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: bash Scripts/verify-oauth.sh --require-browser
      - name: File or update the tracking issue
        # Same shape as the next-toolchain canaries: a weekly email is easy to
        # filter into oblivion, an open issue is the thing that gets triaged, and
        # a growing comment thread says how many weeks it has been broken.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "CI: oauth canary failing (linux)"
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Written to a file rather than a `$(cat <<…)` capture: bash 3.2,
          # which is what a macOS dev box checks this with, can't parse a
          # heredoc inside command substitution.
          body="$RUNNER_TEMP/oauth-body.md"
          cat > "$body" <<BODY
          The \`oauth\` job failed driving a real app through a whole
          authorization-code flow.

          [Failing run]($run_url) — read the PASS/FAIL list before anything else;
          each line names the mechanism it covers.

          **Which half broke?** A failing **CONTROL** line is the environment,
          not the code: with \`--require-browser\` a runner that can't reach a
          browser fails here rather than skipping, so check the default-handler
          step first. A failing **check** is the feature — \`verify-oauth.sh\`
          runs against a fresh \`swift-pwa init\` app and a stand-in provider in
          its own process, so a red line means the loopback receiver, the
          \`state\` check, or the PKCE round-trip actually regressed.

          The last check must time out. If *that* one fails while the rest pass,
          suspect the negative control itself — every check above it is then
          equally consistent with a receiver that resolves whatever it is handed.

          Nothing is blocked meanwhile: this job is not a required check. The
          mobile halves (\`verify-oauth-android.sh\`, \`verify-oauth-ios.sh\`)
          can't run hosted and are unaffected — re-run those on a cabled device
          if the failure looks like it reaches the custom-scheme path.
          BODY
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
            echo "commented on existing #$number"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

  # MARK: - Next-toolchain canaries
  #
  # Every job above pins its toolchain (Linux 6.2, Windows 6.3.1), and those
  # pins are *floors* worth keeping — the GTK4 backend doesn't render below 6.2,
  # and Foundation's file writing is broken on Windows before 6.3.1. The cost is
  # that nothing gating a PR has ever run `swiftbuild`, the engine Swift 6.4
  # made the default, so three engine-behaviour breaks in a row (#218, #219,
  # #229) reached a real box before anything in CI went red. Each one compiled
  # every target cleanly and failed at the **product link of an app** — which is
  # why these jobs link `Examples/HelloPWA` rather than stopping at
  # `swift build`, and why a fresh `swift-pwa init` app would be the wrong
  # vehicle (it depends on the *released* package, not this checkout).
  #
  # Deliberately not on the PR gate: they track whatever release is current, so
  # they can go red for a toolchain regression that isn't ours, and a check that
  # can fail for someone else's reasons must never be able to block a merge.
  # Weekly on the cron above, or `workflow_dispatch` on demand. They are not in
  # the branch-protection list, and matrixing the pinned jobs instead would have
  # renamed their checks (`linux-gtk4 (6.2)`) and wedged every PR on a required
  # check that no longer exists.
  #
  # **When one goes red**, the question is ours or theirs. Ours: fix it, and add
  # the guard that makes the class impossible rather than just the instance
  # (`ManifestDependencyDriftTests` is the one this bought). Theirs: file it
  # upstream and write the version into the platform doc's "Known limitations".
  # Either way it ends within the week — a canary left red for a month is one
  # nobody reads any more. If neither is possible yet, pin the version here so
  # it goes green, and let bumping that pin carry the open question.
  next-toolchain-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      # The release under test. Bump deliberately — and see the "pin it green"
      # note above: parking this on the last good release is how a break that
      # isn't ours stops shouting every week. Keep it in step with the Windows
      # job's two inputs below.
      SWIFT_RELEASE: "6.4.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK3 + WebKitGTK 4.1 + the toolchain's own runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libxml2-dev
      - name: Install the Swift release under test
        # Neither installer this repo uses elsewhere can fetch it:
        # `swift-actions/setup-swift@v2` answers `Version "6.4" is not
        # available`, and `swiftly install 6.4.0` 404s on a URL it builds
        # *without* the patch component. swift.org's own path keeps it
        # (`swift-6.4.0-release/…/swift-6.4.0-RELEASE-…`) while the compiler
        # banner prints `swift-6.4-RELEASE`, which is the trap in the middle.
        # So take the tarball directly, from the version pinned above.
        run: |
          set -euo pipefail
          base="https://download.swift.org/swift-${SWIFT_RELEASE}-release/ubuntu2404"
          name="swift-${SWIFT_RELEASE}-RELEASE-ubuntu24.04"
          curl -fsSL "${base}/swift-${SWIFT_RELEASE}-RELEASE/${name}.tar.gz" -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          # Strip only the version-named top directory, never the `usr/` under
          # it: `swift --version` runs fine from a flattened `bin/`, but
          # swiftbuild derives the toolchain root from the binary's path and
          # then looks for `swiftc` relative to the *working directory*
          # (`…/swift-pwa/swiftc is not an executable file`). Keep the layout
          # swiftly and the distro packages use.
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain under test
        # First line of any failure report: which release, which engine.
        run: swift --version
      - name: Build the package
        run: swift build
      - name: Link an app against it
        # Where the engine bugs actually surface. GTK3 here; #229 was measured
        # byte-identical on both backends, so one is enough to catch the class.
        working-directory: Examples/HelloPWA
        run: swift build -c release
      - name: What reached the product link
        # swiftbuild builds the link list from the *declared* dependency edges,
        # and its failures look like a missing symbol from a target that built
        # perfectly well. This file against `Products/` is the whole diagnosis:
        # a target's `.o` in the second but not the first is an edge problem,
        # not a code one (#229). Printed on success too, so a later failure has
        # a known-good list to diff against.
        if: always()
        working-directory: Examples/HelloPWA
        run: |
          find .build -name '*.LinkFileList' -print -exec cat {} \; || true
          ls -la .build/out/Products/*/ || true
      - name: File or update the tracking issue
        # The weekly email is easy to filter into oblivion, so the canary files
        # its own issue and comments on the existing one rather than opening a
        # second — an open issue is the thing that actually gets triaged, and a
        # growing comment thread says how many weeks it has been broken.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "CI: next-toolchain canary failing (linux)"
          RELEASE: ${{ env.SWIFT_RELEASE }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Written to a file rather than a `$(cat <<…)` capture: bash 3.2,
          # which is what a macOS dev box checks this with, can't parse a
          # heredoc inside command substitution.
          body="$RUNNER_TEMP/canary-body.md"
          cat > "$body" <<BODY
          The \`next-toolchain-linux\` job failed against Swift **$RELEASE**.

          [Failing run]($run_url) — the job prints \`swift --version\` first, and
          dumps the product's \`LinkFileList\` against \`Products/\` whether it
          passes or fails. A target whose object is in the second but not the
          first is a dependency-edge problem, not a code one (#229).

          **Ours or theirs?** Ours: fix it, and add the guard for the class
          rather than the instance. Theirs: file upstream and write the version
          into the platform doc's *Known limitations*. Either way close this out
          within the week — if neither is possible yet, pin \`SWIFT_RELEASE\`
          (or the Windows job's two inputs) to the last good release so the
          canary goes green, and let bumping that pin carry the open question.

          Nothing is blocked meanwhile: this job is not a required check, and
          the gating jobs stay on their pinned toolchains.
          BODY
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
            echo "commented on existing #$number"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

  next-toolchain-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install the Swift release under test
        uses: compnerd/gha-setup-swift@main
        with:
          # Keep the patch component. The compiler banner prints
          # `swift-6.4-RELEASE`, but the download path this action builds is
          # `swift-6.4.0-release/…/swift-6.4.0-RELEASE-windows10.exe` — dropping
          # the `.0` (as `swiftly` does, and as this job did on its first run)
          # 404s. Keep in step with SWIFT_RELEASE in the Linux job above.
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Report the toolchain under test
        run: swift --version
      - name: Install WebView2 SDK + WIL (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Link an app against the package
        # Flags, never INCLUDE / LIB: 6.4 passes neither to the tasks that need
        # them (#219), which is one of the breaks this job exists to catch.
        #
        # The app only, where the Linux job also builds the package first. A
        # package-level build here additionally builds the *test* targets'
        # resource bundles, and swiftbuild's `Touch` task on one of those is
        # racy on Windows — `copy /b …_SwiftPWACLITests.bundle +,,` failing with
        # "The process cannot access the file because it is being used by
        # another process", green on one run and red on the next. That build is
        # the gating `windows` job's business at its own pinned toolchain; what
        # this job is here to ask is whether an app still links.
        shell: pwsh
        run: |
          $flags  = @("$pwd\packages\Microsoft.Web.WebView2\build\native\include",
                      "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include") |
                    ForEach-Object { '-Xcc', "-I$_" }
          $flags += '-Xlinker', "/LIBPATH:$pwd\packages\Microsoft.Web.WebView2\build\native\x64"
          Set-Location Examples\HelloPWA
          swift build -c release @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: What reached the product link
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.LinkFileList' Examples\HelloPWA\.build -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName; Get-Content $_.FullName }
          Get-ChildItem Examples\HelloPWA\.build\out\Products\* -ErrorAction SilentlyContinue
      - name: File or update the tracking issue
        # The weekly email is easy to filter into oblivion, so the canary files
        # its own issue and comments on the existing one rather than opening a
        # second — an open issue is the thing that actually gets triaged, and a
        # growing comment thread says how many weeks it has been broken.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "CI: next-toolchain canary failing (windows)"
          RELEASE: "6.4.0"
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Written to a file rather than a `$(cat <<…)` capture: bash 3.2,
          # which is what a macOS dev box checks this with, can't parse a
          # heredoc inside command substitution.
          body="$RUNNER_TEMP/canary-body.md"
          cat > "$body" <<BODY
          The \`next-toolchain-windows\` job failed against Swift **$RELEASE**.

          [Failing run]($run_url) — the job prints \`swift --version\` first, and
          dumps the product's \`LinkFileList\` against \`Products/\` whether it
          passes or fails. A target whose object is in the second but not the
          first is a dependency-edge problem, not a code one (#229).

          **Ours or theirs?** Ours: fix it, and add the guard for the class
          rather than the instance. Theirs: file upstream and write the version
          into the platform doc's *Known limitations*. Either way close this out
          within the week — if neither is possible yet, pin \`SWIFT_RELEASE\`
          (or the Windows job's two inputs) to the last good release so the
          canary goes green, and let bumping that pin carry the open question.

          Nothing is blocked meanwhile: this job is not a required check, and
          the gating jobs stay on their pinned toolchains.
          BODY
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
            echo "commented on existing #$number"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

  macos-llama:
    # Coverage for the opt-in llama.cpp backend. It's env-gated
    # (SWIFT_PWA_LLAMA) so the default `macos` job above never compiles it —
    # this job builds the prebuilt xcframework (macOS slice) via the same
    # script CI/release uses, then runs the gated suite. The GBNF unit tests +
    # compile run here; the model-dependent e2e tests skip (no GGUF in CI,
    # mirroring the Foundation Models e2e).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Cache prebuilt llama xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama
          # Keyed on the build script, which pins the llama.cpp commit — bump
          # the pin and the cache rebuilds.
          key: llama-xcframework-macos-${{ hashFiles('Scripts/build-llama-xcframework.sh') }}
      - name: Build llama xcframework (macOS slice)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash Scripts/build-llama-xcframework.sh macos
      - name: Test SwiftPWALlama (gate on)
        env:
          SWIFT_PWA_LLAMA: "1"
        run: swift test --filter SwiftPWALlamaTests -v

  linux-llama:
    # Linux coverage for the opt-in llama.cpp backend (Vulkan). Mirrors
    # macos-llama: builds the prebuilt static lib via the same script the
    # publish workflow uses (cached on the build-script hash → only rebuilds on
    # a llama.cpp pin bump), then runs the gated suite. The lib is found at link
    # time via `-Xlinker -L` — no unsafeFlags, and no LIBRARY_PATH, which Swift
    # 6.4's swiftbuild engine stops passing to the link task (#219). The GBNF +
    # API tests run here; the model-dependent e2e tests skip (no GGUF in CI).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          # 6.2 floor on Linux, not 6.0: the GTK4 backend does not render
          # under 6.0.3 — the app comes up on about:blank because the custom
          # `pwa://` scheme handler is never invoked, silently and with no
          # error. Verified on a real GTK4 box: same commit, body 0 under
          # 6.0.3 and a fully loaded page under 6.2 / 6.3.1. Keep this in step
          # with `.swift-version`, which swiftly honours inside the checkout.
          swift-version: "6.2"
      - run: swift --version
      - name: Install GTK3 + WebKitGTK + Vulkan link/build deps
        # GTK3 dev: the default package graph includes the GTK system-library
        # targets, and `swift test` compiles every test target into one bundle —
        # so pkgConfig must resolve even though the llama suite doesn't use GTK.
        # libvulkan-dev: the test executable links `-lvulkan` (the loader). cmake
        # + ninja build libllama.a.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libvulkan-dev \
            cmake ninja-build
      - name: Install Vulkan SDK (LunarG tarball)
        # Provides SPIRV-Headers' cmake config + glslc for ggml's Vulkan build
        # (system libvulkan-dev alone is not enough). Version-independent tarball.
        run: |
          mkdir -p "$HOME/vulkan-sdk"
          curl -fsSL -o /tmp/vulkan_sdk.tar.xz "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz"
          tar -C "$HOME/vulkan-sdk" -xf /tmp/vulkan_sdk.tar.xz
      - name: Cache prebuilt libllama.a (Linux/Vulkan)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama-linux
          # Keyed on the build script, which pins the llama.cpp commit — bump
          # the pin and the cache rebuilds.
          key: llama-linux-x86_64-${{ hashFiles('Scripts/build-llama-linux.sh') }}
      - name: Build libllama.a (Vulkan, static)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          SDK_DIR="$(find "$HOME/vulkan-sdk" -maxdepth 1 -name '1.*' -type d | head -1)"
          # shellcheck disable=SC1091
          set +u; . "$SDK_DIR/setup-env.sh"; set -u
          bash Scripts/build-llama-linux.sh
      - name: Test SwiftPWALlama (gate on)
        # libllama.a found via `-Xlinker -L`; SWIFT_PWA_LLAMA puts the target in
        # the graph. Tiny suite, but give it room (the link pass + first build).
        timeout-minutes: 20
        env:
          SWIFT_PWA_LLAMA: "1"
        run: swift test --filter SwiftPWALlamaTests -Xlinker -L"$PWD/Vendor/llama-linux" -v

  windows-llama:
    # Windows coverage for the opt-in llama.cpp backend (x64 / Vulkan). Unlike
    # macos-/linux-llama this is a LINK CHECK, not a test run: SwiftPM's
    # swift-testing discovery emits 0-byte stubs on Windows (see the `windows`
    # job), so we can't *run* SwiftPWALlamaTests — but `swift build --build-tests`
    # still compiles + links the test bundle, which is what exercises the
    # `.systemLibrary` CLlama target and the `llama.lib` / `vulkan-1.lib` link
    # settings. No GPU on the runner; runtime Vulkan enumeration only happens on
    # device (bmsfmv3). Pinned to windows-2022 for the same MSVC/Clang-STL reason
    # as the `windows` job.
    #
    # x64 ONLY. The arm64 (Snapdragon X) build is real and device-verified — built
    # (clang-cl, CPU-only), linked, and run on a Snapdragon X box — but it has NO
    # CI leg yet: GitHub's windows-11-arm runner can't host a usable Swift
    # toolchain. gha-setup-swift installs an x64 toolchain there at 6.1.2 (the
    # arm64 MSVC env then can't even link the manifest: "msvcrt.lib machine type
    # arm64 conflicts with x64"), and the native arm64 toolchain at 6.3.1 crashes
    # on launch (access violation, 0xC0000005). Revisit when the arm64
    # Swift-on-Windows toolchain is reliably installable in the runner image; the
    # build script + Package.swift arm64 paths are exercised on-device meanwhile.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - run: swift --version
      - name: Install WebView2 SDK + WIL (NuGet)
        # The full package graph compiles CWebView2Shim, which needs these
        # even though the llama suite doesn't use WebView2.
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Install the Vulkan SDK (LunarG silent installer)
        # Provides glslc + SPIRV-Headers (build llama.lib) and vulkan-1.lib (the
        # test-bundle link). Mirrors llama-windows.yml.
        shell: pwsh
        run: |
          $url = 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\vulkan_sdk.exe"
          Start-Process -Wait -FilePath "$env:TEMP\vulkan_sdk.exe" `
            -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install'
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache prebuilt llama.lib (Windows/Vulkan)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama-windows
          # Keyed on the build script, which pins the llama.cpp commit.
          key: llama-windows-x64-${{ hashFiles('Scripts/build-llama-windows.ps1') }}
      - name: Build llama.lib (Vulkan, static)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: pwsh Scripts/build-llama-windows.ps1 -Arch x64
      - name: Collect the WebView2 / WIL / llama header + library dirs
        # As flags, not on INCLUDE / LIB: Swift 6.4's swiftbuild engine passes
        # neither to the tasks that need them — measured on a real Windows box,
        # a header only on INCLUDE is `file not found` and a library only on
        # LIB is `could not open`, both with a passing flag-based control
        # (#219). One mechanism beats two that can silently disagree.
        shell: pwsh
        run: |
          $webview2Inc = "$pwd\packages\Microsoft.Web.WebView2\build\native\include"
          $wilInc      = "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include"
          $webview2Lib = "$pwd\packages\Microsoft.Web.WebView2\build\native\x64"
          $llamaLib    = "$pwd\Vendor\llama-windows"
          $vulkanLib   = "$env:VULKAN_SDK\Lib"   # vulkan-1.lib (loader import lib)
          Add-Content -Path $env:GITHUB_ENV -Value "SWIFT_PWA_CI_INCLUDES=$webview2Inc;$wilInc"
          Add-Content -Path $env:GITHUB_ENV -Value "SWIFT_PWA_CI_LIBPATHS=$webview2Lib;$llamaLib;$vulkanLib"
      - name: Build + link-check SwiftPWALlama (gate on)
        # SWIFT_PWA_LLAMA puts the target in the graph; llama.lib / vulkan-1.lib
        # resolve off the `/LIBPATH:` flags. `--build-tests` links
        # SwiftPWALlamaTests, exercising the systemLibrary + linker settings
        # without running anything.
        timeout-minutes: 30
        shell: pwsh
        env:
          SWIFT_PWA_LLAMA: "1"
        run: |
          $flags  = $env:SWIFT_PWA_CI_INCLUDES -split ';' | ForEach-Object { '-Xcc', "-I$_" }
          $flags += $env:SWIFT_PWA_CI_LIBPATHS -split ';' | ForEach-Object { '-Xlinker', "/LIBPATH:$_" }
          swift build --build-tests @flags

  linux-gtk3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          # 6.2 floor on Linux, not 6.0: the GTK4 backend does not render
          # under 6.0.3 — the app comes up on about:blank because the custom
          # `pwa://` scheme handler is never invoked, silently and with no
          # error. Verified on a real GTK4 box: same commit, body 0 under
          # 6.0.3 and a fully loaded page under 6.2 / 6.3.1. Keep this in step
          # with `.swift-version`, which swiftly honours inside the checkout.
          swift-version: "6.2"
      - name: Show Swift version
        run: swift --version
      - name: Install GTK3 + WebKitGTK 4.1 + libayatana-appindicator3
        # Required so SwiftPM's package graph resolution doesn't fail
        # on the pkgConfig declarations for the GTK system-library targets,
        # even when SwiftPWAGTK itself isn't built into the test executable.
        # `libayatana-appindicator3-dev` was added when the tray plugin
        # landed — without it the C shim's `<libayatana-appindicator/...>`
        # include fails resolution.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb
      - name: Build full graph (Core + CLI + SwiftPWAGTK + SwiftPWA umbrella)
        # `swift build` with no `--target` compiles every target in
        # the package, including SwiftPWAGTK and the umbrella. This
        # catches GTK-specific Linux compile errors early — `#if
        # os(Linux)`-gated source files (SystemDialog.swift,
        # SystemBiometricAuth.swift, etc.) are invisible to the macOS
        # CI job, so without this step strict-concurrency / type-
        # inference regressions would slip past every push.
        run: swift build -v
      - name: Build test targets
        # `--build-tests` compiles the test bundles outside the test
        # step's timer. Without it, `swift test` rebuilds the
        # _SwiftPWATestSupport / *Tests modules from scratch — fast
        # locally but slow on hosted runners (swift-crypto's BoringSSL
        # alone is hundreds of clang invocations).
        run: swift build --build-tests
      - name: Test Core + CLI
        # Scripts/ci-test-linux.sh runs the built test bundle directly and
        # reads swift-testing's structured event stream from a file, instead
        # of `swift test`. This is immune to the known swift-corelibs exit-hang
        # (tests pass, then the async-`@main` drain never fires the final
        # `exit()`) which eats `swift test`'s stdout summary: the file's
        # `runEnded` verdict and any recorded `"symbol":"fail"` are read
        # directly and the parked process is killed. A recorded failure fails
        # the job immediately (never retried/masked); only a lost event-stream
        # tail is retried. See the script header, docs/linux-setup.md, issue #39.
        timeout-minutes: 20
        run: bash Scripts/ci-test-linux.sh

  linux-gtk4:
    runs-on: ubuntu-24.04
    env:
      SWIFT_PWA_GTK4: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          # 6.2 floor on Linux, not 6.0: the GTK4 backend does not render
          # under 6.0.3 — the app comes up on about:blank because the custom
          # `pwa://` scheme handler is never invoked, silently and with no
          # error. Verified on a real GTK4 box: same commit, body 0 under
          # 6.0.3 and a fully loaded page under 6.2 / 6.3.1. Keep this in step
          # with `.swift-version`, which swiftly honours inside the checkout.
          swift-version: "6.2"
      - name: Show Swift version
        run: swift --version
      - name: Install GTK4 + WebKitGTK 6.0
        # `SWIFT_PWA_GTK4=1` swaps the package graph to use the GTK4 /
        # WebKitGTK 6.0 system-library targets; pkgConfig resolution
        # needs the matching dev packages installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            xvfb
      - name: Build full graph (Core + CLI + SwiftPWAGTK + SwiftPWA umbrella)
        # Same rationale as linux-gtk3: the GTK4 SystemDialog,
        # SystemBiometricAuth, etc. are `#if os(Linux)`-gated and
        # therefore invisible to macOS CI. Compile-gating them here
        # catches strict-concurrency regressions Apple's toolchain
        # doesn't flag, plus pkg-config-resolution issues on the
        # GTK4 + WebKitGTK 6.0 system-library targets.
        run: swift build -v
      - name: Build test targets
        run: swift build --build-tests
      - name: Test Core + CLI
        # See linux-gtk3 + Scripts/ci-test-linux.sh: runs the test bundle
        # directly and reads swift-testing's event-stream verdict from a file,
        # tolerating the swift-corelibs exit-hang without masking real failures.
        timeout-minutes: 20
        run: bash Scripts/ci-test-linux.sh

  windows:
    # Pinned to windows-2022 (matching release.yml) rather than
    # windows-latest. The newer runner image ships MSVC 14.51 (VS18),
    # whose STL hard-errors with `STL1000: Unexpected compiler version,
    # expected Clang 20 or newer` against the older Clang bundled in
    # Swift 6.1.2 — it fails the CWebView2Shim C++ compile before any
    # Swift builds. Stay on 2022's MSVC until the pinned Swift toolchain
    # ships a Clang the latest MSVC STL accepts.
    runs-on: windows-2022
    # The Windows backend (`SwiftPWAWindows` + `CWebView2Shim`) needs:
    #   1. The MSVC dev environment (CRT headers / libs on INCLUDE / LIB).
    #   2. Swift for Windows.
    #   3. NuGet packages for the WebView2 SDK headers + static loader
    #      and the WIL headers.
    #
    # `ilammy/msvc-dev-cmd@v1` writes the VS-dev-shell exports to
    # `$GITHUB_ENV` so they persist across steps — `Launch-VsDevShell.ps1`
    # only mutates the current shell, which doesn't carry between
    # `run:` blocks.
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          # Floor: Swift 6.0.x trips a `ucrt -> _Builtin_intrinsics -> ucrt`
          # cyclic-module-import error against the Windows SDK on the runner
          # image — fixed in 6.1+.
          #
          # Why not 6.1.2, which this pinned for a long time: Foundation's file
          # writing is broken on Windows there, and it broke the shipped CLI
          # rather than the build, so a green Windows job proved nothing. See
          # the matching note in release.yml — CI and the release must move
          # together, because a toolchain we build with but don't ship is one
          # whose bugs we never see, and vice versa.
          # (`swift-version` / `swift-build` replaced the deprecated
          # `branch` / `tag` inputs.)
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - run: swift --version
      - name: Install WebView2 SDK + WIL (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Collect the WebView2 / WIL header + library dirs
        # As flags, not on INCLUDE / LIB — Swift 6.4's swiftbuild engine passes
        # neither to the tasks that need them (#219). The same single mechanism
        # the CLI itself now uses.
        shell: pwsh
        run: |
          $webview2Inc = "$pwd\packages\Microsoft.Web.WebView2\build\native\include"
          $wilInc      = "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include"
          $webview2Lib = "$pwd\packages\Microsoft.Web.WebView2\build\native\x64"
          Add-Content -Path $env:GITHUB_ENV -Value "SWIFT_PWA_CI_INCLUDES=$webview2Inc;$wilInc"
          Add-Content -Path $env:GITHUB_ENV -Value "SWIFT_PWA_CI_LIBPATHS=$webview2Lib"
      - name: Build (release)
        shell: pwsh
        run: |
          $flags  = $env:SWIFT_PWA_CI_INCLUDES -split ';' | ForEach-Object { '-Xcc', "-I$_" }
          $flags += $env:SWIFT_PWA_CI_LIBPATHS -split ';' | ForEach-Object { '-Xlinker', "/LIBPATH:$_" }
          swift build -c release @flags
      - name: Smoke-test the built CLI (it must actually run)
        # This job compiles and link-checks but never used to *run* anything,
        # and that blind spot shipped two bugs in the Windows CLI — a crash on
        # `init` and silently truncated file writes, both from the toolchain,
        # both through a green build. `init` only writes files (no network, no
        # git), so it probes exactly the path that broke; the size assertions
        # catch a silent truncation as well as a hard crash. Mirrors the
        # staged-binary smoke in release.yml — keep the two in step.
        shell: pwsh
        run: |
          $exe = Join-Path $PWD ".build\release\swift-pwa.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }

          $tmp = Join-Path $env:RUNNER_TEMP "cli-smoke"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Push-Location $tmp
          & $exe init SmokeApp
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "init exited $code (0xC0000005 = access violation)" }

          foreach ($rel in @('Package.swift', 'pwa.json', 'web\index.html', 'Sources\SmokeApp\App.swift')) {
            $p = Join-Path $tmp "SmokeApp\$rel"
            if (-not (Test-Path $p)) { throw "init reported success but did not write $rel" }
            $len = (Get-Item $p).Length
            if ($len -lt 64) { throw "$rel is only $len bytes — a truncated write" }
            Write-Host ("ok  {0,-34} {1} bytes" -f $rel, $len)
          }
      - name: Build (debug + test targets)
        # `swift test` drops back to the debug configuration regardless
        # of the prior release build, which on Windows means a from-
        # scratch rebuild of swift-crypto's BoringSSL (~hundreds of
        # clang invocations). `--build-tests` compiles both the package
        # libraries and the test bundles in one pass outside the test
        # step's 5-min timer.
        #
        # We keep `--build-tests` even though we don't *run* SwiftPM's
        # test bundles on Windows (see next step) — it's still the
        # cheapest way to compile-check the cross-platform test suites
        # against the Windows toolchain.
        shell: pwsh
        run: |
          $flags  = $env:SWIFT_PWA_CI_INCLUDES -split ';' | ForEach-Object { '-Xcc', "-I$_" }
          $flags += $env:SWIFT_PWA_CI_LIBPATHS -split ';' | ForEach-Object { '-Xlinker', "/LIBPATH:$_" }
          swift build --build-tests @flags
      - name: Test (SwiftPWAWindowsTestRunner)
        # Why an executable instead of `swift test`: SwiftPM's
        # swift-testing discovery build plugin emits 0-byte stubs for
        # every suite on Windows (verified locally on Swift 6.1.2 and
        # 6.3.1, both x64 and arm64), so the test bundle finds zero
        # tests at runtime and `swift test` exits 1 with no stderr.
        # `--list-tests` / `--dump-tests-json` hang on the same path,
        # which is what surfaced as `error: abnormal(312)` in CI when
        # `--filter` was in play. `--disable-xctest` doesn't help: the
        # swift-testing pass also finds zero tests because the
        # discovery sections aren't populated.
        #
        # SwiftPWAWindowsTestRunner re-expresses the WindowsUpdater
        # coverage as a plain executable with a small assertion harness
        # so we get real signal on every push. See
        # docs/windows-setup.md "Known limitations" for the long form.
        # 12-min timeout matches the linux-gtk3 rationale: even after
        # `--build-tests`, `swift run` still does an incremental link
        # pass and Windows runners are slow.
        timeout-minutes: 12
        shell: pwsh
        run: |
          $flags  = $env:SWIFT_PWA_CI_INCLUDES -split ';' | ForEach-Object { '-Xcc', "-I$_" }
          $flags += $env:SWIFT_PWA_CI_LIBPATHS -split ';' | ForEach-Object { '-Xlinker', "/LIBPATH:$_" }
          swift run @flags SwiftPWAWindowsTestRunner

  android:
    # Android Gradle-scaffold smoke test on Examples/HelloPWA: generate the
    # Gradle project (bundler codegen) and build it with `assembleDebug`.
    #
    # This deliberately does NOT run the Swift Android cross-compile
    # (`--cross-compile-android`). That path needs the swift-android-sdk, which
    # does not reliably produce a native `.so` on the GitHub `ubuntu-24.04`
    # runner — an elusive `missing required module 'SwiftAndroid'` that does not
    # reproduce on a real Linux box or on device (all observable SDK/toolchain/
    # clang state is identical). Attempting it here previously shipped a *hollow*
    # APK behind a green check for months. So the job verifies what the runner
    # can do reliably; the native cross-compile is device-verified (Galaxy Tab
    # S10+) and guarded for local/user builds by `--cross-compile-android`'s
    # hard-fail-on-skipped-ABI (see AndroidBundler). Restore the cross-compile
    # step if the runner story improves.
    runs-on: ubuntu-24.04
    needs: macos
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift toolchain runtime deps
        # `ubuntu-24.04` images don't preinstall libcurl4-openssl-dev,
        # and swiftly's post-install dependency check exits non-zero
        # without it — even though the toolchain itself extracts fine.
        # libsecret-1-dev used to be here too; CSecretShim `dlopen`s libsecret
        # now, so nothing includes its headers at build time (#199).
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install Swiftly
        # Swiftly is the canonical way to install pinned Swift
        # toolchains on Linux — `swift-actions/setup-swift` doesn't
        # publish 6.2.x point-releases, and the Swift Android SDK 6.2
        # requires the matching 6.2.0 compiler (.swiftmodule format
        # isn't ABI-stable across patch releases yet).
        run: |
          curl -fsSL https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz | tar -xz
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
      - name: Install Swift 6.2.0
        run: |
          swiftly install 6.2.0
          swiftly use 6.2.0
          swift --version
      - name: Set up JDK 17
        # AGP 8.5 requires JDK 17 (Java 21 trips a "no toolchain
        # found" warning under AGP 8.5; AGP 8.7+ relaxes the
        # constraint, but we pin AGP 8.5 in the scaffold so the
        # workflow follows that pin).
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build swift-pwa CLI (host toolchain)
        run: swift build --product swift-pwa
      - name: Emit Gradle scaffold + assembleDebug (scaffold smoke test)
        # Scaffold-only: generate the Gradle project and build it, WITHOUT the
        # Swift Android cross-compile. The cross-compile requires the
        # swift-android-sdk, which does not reliably build a native `.so` on the
        # GitHub `ubuntu-24.04` runner (an elusive `missing required module
        # 'SwiftAndroid'` that does NOT reproduce on a real Linux box or on
        # device — everything observable about the SDK/toolchain/clang wiring is
        # identical). Rather than ship a hollow APK behind a green check (which
        # is what the `--cross-compile-android` path silently did for months),
        # this job verifies what the runner *can* do reliably — bundler codegen
        # + `aapt2`/`d8` via Gradle. The real native cross-compile is covered by
        # `--cross-compile-android`'s hard-fail (see AndroidBundler) for local /
        # user builds and is verified on-device (device-verified on a Galaxy Tab
        # S10+; a cold build also succeeds on the project's Linux box). If the
        # runner story improves, restore `--cross-compile-android` here.
        # Cross-compile is off by default (no --cross-compile-android), so the
        # bundler emits the scaffold with empty jniLibs/ — exactly the
        # scaffold-only smoke test we want here.
        run: |
          cd Examples/HelloPWA
          swift run --package-path ../.. swift-pwa build --target android
      - name: Run gradle assembleDebug
        # The vendored Gradle wrapper bootstraps Gradle 8.10.2 on
        # first run; subsequent runs are cache hits. JAVA_HOME is
        # picked up from the setup-java step.
        run: |
          cd Examples/HelloPWA/build/android/HelloPWA-android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists
        run: |
          APK=Examples/HelloPWA/build/android/HelloPWA-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || (echo "no APK at $APK" && exit 1)
          ls -lh "$APK"
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: HelloPWA-debug-apk
          path: Examples/HelloPWA/build/android/HelloPWA-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Pin swiftformat to a specific release rather than `brew install
      # swiftformat` (which tracks latest) so the lint is reproducible: an
      # unpinned upgrade that adds/enables a new default rule (e.g.
      # wrapIfStatementBodies) would otherwise fail the whole repo on an
      # unrelated PR. Bump this in lockstep with a `swiftformat .` reformat.
      - name: Install swiftformat
        env:
          SWIFTFORMAT_VERSION: 0.61.1
        run: |
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo mv /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          sudo chmod +x /usr/local/bin/swiftformat
          /usr/local/bin/swiftformat --version
      - name: Lint
        run: /usr/local/bin/swiftformat --lint .
