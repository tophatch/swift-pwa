name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build -v
      - name: Test (Core + WKWebView + CLI)
        run: swift test -v

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show available iOS Simulator destinations
        run: xcodebuild -showsdks
      - name: Compile SwiftPWAWebKit for iOS Simulator
        # Use xcodebuild against the SwiftPM workspace because Apple
        # does not ship an iOS Swift SDK that `swift build --triple`
        # can target directly. We build the umbrella `SwiftPWA` library
        # via the SwiftPWA scheme on a generic iOS Simulator destination.
        run: |
          xcodebuild \
            -scheme SwiftPWA \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build/ios-sim \
            build

  macos-llama:
    # Coverage for the opt-in llama.cpp backend. It's env-gated
    # (SWIFT_PWA_LLAMA) so the default `macos` job above never compiles it —
    # this job builds the prebuilt xcframework (macOS slice) via the same
    # script CI/release uses, then runs the gated suite. The GBNF unit tests +
    # compile run here; the model-dependent e2e tests skip (no GGUF in CI,
    # mirroring the Foundation Models e2e).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Cache prebuilt llama xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama
          # Keyed on the build script, which pins the llama.cpp commit — bump
          # the pin and the cache rebuilds.
          key: llama-xcframework-macos-${{ hashFiles('Scripts/build-llama-xcframework.sh') }}
      - name: Build llama xcframework (macOS slice)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash Scripts/build-llama-xcframework.sh macos
      - name: Test SwiftPWALlama (gate on)
        env:
          SWIFT_PWA_LLAMA: "1"
        run: swift test --filter SwiftPWALlamaTests -v

  linux-llama:
    # Linux coverage for the opt-in llama.cpp backend (Vulkan). Mirrors
    # macos-llama: builds the prebuilt static lib via the same script the
    # publish workflow uses (cached on the build-script hash → only rebuilds on
    # a llama.cpp pin bump), then runs the gated suite. The lib is found at link
    # time via LIBRARY_PATH — no unsafeFlags. The GBNF + API tests run here; the
    # model-dependent e2e tests skip (no GGUF in CI).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift --version
      - name: Install GTK3 + WebKitGTK + Vulkan link/build deps
        # GTK3 dev: the default package graph includes the GTK system-library
        # targets, and `swift test` compiles every test target into one bundle —
        # so pkgConfig must resolve even though the llama suite doesn't use GTK.
        # libvulkan-dev: the test executable links `-lvulkan` (the loader). cmake
        # + ninja build libllama.a.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libvulkan-dev \
            cmake ninja-build
      - name: Install Vulkan SDK (LunarG tarball)
        # Provides SPIRV-Headers' cmake config + glslc for ggml's Vulkan build
        # (system libvulkan-dev alone is not enough). Version-independent tarball.
        run: |
          mkdir -p "$HOME/vulkan-sdk"
          curl -fsSL -o /tmp/vulkan_sdk.tar.xz "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz"
          tar -C "$HOME/vulkan-sdk" -xf /tmp/vulkan_sdk.tar.xz
      - name: Cache prebuilt libllama.a (Linux/Vulkan)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama-linux
          # Keyed on the build script, which pins the llama.cpp commit — bump
          # the pin and the cache rebuilds.
          key: llama-linux-x86_64-${{ hashFiles('Scripts/build-llama-linux.sh') }}
      - name: Build libllama.a (Vulkan, static)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          SDK_DIR="$(find "$HOME/vulkan-sdk" -maxdepth 1 -name '1.*' -type d | head -1)"
          # shellcheck disable=SC1091
          set +u; . "$SDK_DIR/setup-env.sh"; set -u
          bash Scripts/build-llama-linux.sh
      - name: Test SwiftPWALlama (gate on)
        # libllama.a found via LIBRARY_PATH; SWIFT_PWA_LLAMA puts the target in
        # the graph. Tiny suite, but give it room (the link pass + first build).
        timeout-minutes: 20
        env:
          SWIFT_PWA_LLAMA: "1"
        run: LIBRARY_PATH="$PWD/Vendor/llama-linux:${LIBRARY_PATH:-}" swift test --filter SwiftPWALlamaTests -v

  windows-llama:
    # Windows coverage for the opt-in llama.cpp backend (x64 / Vulkan). Unlike
    # macos-/linux-llama this is a LINK CHECK, not a test run: SwiftPM's
    # swift-testing discovery emits 0-byte stubs on Windows (see the `windows`
    # job), so we can't *run* SwiftPWALlamaTests — but `swift build --build-tests`
    # still compiles + links the test bundle, which is what exercises the
    # `.systemLibrary` CLlama target and the `llama.lib` / `vulkan-1.lib` link
    # settings. No GPU on the runner; runtime Vulkan enumeration only happens on
    # device (bmsfmv3). Pinned to windows-2022 for the same MSVC/Clang-STL reason
    # as the `windows` job.
    #
    # x64 ONLY. The arm64 (Snapdragon X) build is real and device-verified — built
    # (clang-cl, CPU-only), linked, and run on a Snapdragon X box — but it has NO
    # CI leg yet: GitHub's windows-11-arm runner can't host a usable Swift
    # toolchain. gha-setup-swift installs an x64 toolchain there at 6.1.2 (the
    # arm64 MSVC env then can't even link the manifest: "msvcrt.lib machine type
    # arm64 conflicts with x64"), and the native arm64 toolchain at 6.3.1 crashes
    # on launch (access violation, 0xC0000005). Revisit when the arm64
    # Swift-on-Windows toolchain is reliably installable in the runner image; the
    # build script + Package.swift arm64 paths are exercised on-device meanwhile.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - run: swift --version
      - name: Install WebView2 SDK + WIL (NuGet)
        # The full package graph compiles CWebView2Shim, which needs these on
        # INCLUDE / LIB even though the llama suite doesn't use WebView2.
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Install the Vulkan SDK (LunarG silent installer)
        # Provides glslc + SPIRV-Headers (build llama.lib) and vulkan-1.lib (the
        # test-bundle link). Mirrors llama-windows.yml.
        shell: pwsh
        run: |
          $url = 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\vulkan_sdk.exe"
          Start-Process -Wait -FilePath "$env:TEMP\vulkan_sdk.exe" `
            -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install'
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache prebuilt llama.lib (Windows/Vulkan)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama-windows
          # Keyed on the build script, which pins the llama.cpp commit.
          key: llama-windows-x64-${{ hashFiles('Scripts/build-llama-windows.ps1') }}
      - name: Build llama.lib (Vulkan, static)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: pwsh Scripts/build-llama-windows.ps1 -Arch x64
      - name: Add WebView2 / WIL / llama.lib to INCLUDE / LIB
        shell: pwsh
        run: |
          $webview2Inc = "$pwd\packages\Microsoft.Web.WebView2\build\native\include"
          $wilInc      = "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include"
          $webview2Lib = "$pwd\packages\Microsoft.Web.WebView2\build\native\x64"
          $llamaLib    = "$pwd\Vendor\llama-windows"
          $vulkanLib   = "$env:VULKAN_SDK\Lib"   # vulkan-1.lib (loader import lib)
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$webview2Inc;$wilInc;$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$webview2Lib;$llamaLib;$vulkanLib;$env:LIB"
      - name: Build + link-check SwiftPWALlama (gate on)
        # SWIFT_PWA_LLAMA puts the target in the graph; llama.lib / vulkan-1.lib
        # resolve off LIB. `--build-tests` links SwiftPWALlamaTests, exercising
        # the systemLibrary + linker settings without running anything.
        timeout-minutes: 30
        env:
          SWIFT_PWA_LLAMA: "1"
        run: swift build --build-tests

  linux-gtk3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Show Swift version
        run: swift --version
      - name: Install GTK3 + WebKitGTK 4.1 + libayatana-appindicator3
        # Required so SwiftPM's package graph resolution doesn't fail
        # on the pkgConfig declarations for the GTK system-library targets,
        # even when SwiftPWAGTK itself isn't built into the test executable.
        # `libayatana-appindicator3-dev` was added when the tray plugin
        # landed — without it the C shim's `<libayatana-appindicator/...>`
        # include fails resolution.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            xvfb
      - name: Build full graph (Core + CLI + SwiftPWAGTK + SwiftPWA umbrella)
        # `swift build` with no `--target` compiles every target in
        # the package, including SwiftPWAGTK and the umbrella. This
        # catches GTK-specific Linux compile errors early — `#if
        # os(Linux)`-gated source files (SystemDialog.swift,
        # SystemBiometricAuth.swift, etc.) are invisible to the macOS
        # CI job, so without this step strict-concurrency / type-
        # inference regressions would slip past every push.
        run: swift build -v
      - name: Build test targets
        # `--build-tests` compiles the test bundles outside the test
        # step's timer. Without it, `swift test` rebuilds the
        # _SwiftPWATestSupport / *Tests modules from scratch — fast
        # locally but slow on hosted runners (swift-crypto's BoringSSL
        # alone is hundreds of clang invocations).
        run: swift build --build-tests
      - name: Test Core + CLI
        # Scripts/ci-test-linux.sh runs the built test bundle directly and
        # reads swift-testing's structured event stream from a file, instead
        # of `swift test`. This is immune to the known swift-corelibs exit-hang
        # (tests pass, then the async-`@main` drain never fires the final
        # `exit()`) which eats `swift test`'s stdout summary: the file's
        # `runEnded` verdict and any recorded `"symbol":"fail"` are read
        # directly and the parked process is killed. A recorded failure fails
        # the job immediately (never retried/masked); only a lost event-stream
        # tail is retried. See the script header, docs/linux-setup.md, issue #39.
        timeout-minutes: 20
        run: bash Scripts/ci-test-linux.sh

  linux-gtk4:
    runs-on: ubuntu-24.04
    env:
      SWIFT_PWA_GTK4: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Show Swift version
        run: swift --version
      - name: Install GTK4 + WebKitGTK 6.0
        # `SWIFT_PWA_GTK4=1` swaps the package graph to use the GTK4 /
        # WebKitGTK 6.0 system-library targets; pkgConfig resolution
        # needs the matching dev packages installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsecret-1-dev \
            xvfb
      - name: Build full graph (Core + CLI + SwiftPWAGTK + SwiftPWA umbrella)
        # Same rationale as linux-gtk3: the GTK4 SystemDialog,
        # SystemBiometricAuth, etc. are `#if os(Linux)`-gated and
        # therefore invisible to macOS CI. Compile-gating them here
        # catches strict-concurrency regressions Apple's toolchain
        # doesn't flag, plus pkg-config-resolution issues on the
        # GTK4 + WebKitGTK 6.0 system-library targets.
        run: swift build -v
      - name: Build test targets
        run: swift build --build-tests
      - name: Test Core + CLI
        # See linux-gtk3 + Scripts/ci-test-linux.sh: runs the test bundle
        # directly and reads swift-testing's event-stream verdict from a file,
        # tolerating the swift-corelibs exit-hang without masking real failures.
        timeout-minutes: 20
        run: bash Scripts/ci-test-linux.sh

  windows:
    # Pinned to windows-2022 (matching release.yml) rather than
    # windows-latest. The newer runner image ships MSVC 14.51 (VS18),
    # whose STL hard-errors with `STL1000: Unexpected compiler version,
    # expected Clang 20 or newer` against the older Clang bundled in
    # Swift 6.1.2 — it fails the CWebView2Shim C++ compile before any
    # Swift builds. Stay on 2022's MSVC until the pinned Swift toolchain
    # ships a Clang the latest MSVC STL accepts.
    runs-on: windows-2022
    # The Windows backend (`SwiftPWAWindows` + `CWebView2Shim`) needs:
    #   1. The MSVC dev environment (CRT headers / libs on INCLUDE / LIB).
    #   2. Swift for Windows.
    #   3. NuGet packages for the WebView2 SDK headers + static loader
    #      and the WIL headers.
    #
    # `ilammy/msvc-dev-cmd@v1` writes the VS-dev-shell exports to
    # `$GITHUB_ENV` so they persist across steps — `Launch-VsDevShell.ps1`
    # only mutates the current shell, which doesn't carry between
    # `run:` blocks.
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          # Swift 6.0.x trips a `ucrt -> _Builtin_intrinsics -> ucrt`
          # cyclic-module-import error against the Windows SDK shipped
          # on `windows-latest` — fixed in 6.1+. Stay on the latest
          # 6.1 stable for now; bump as new releases land.
          # (`swift-version` / `swift-build` replaced the deprecated
          # `branch` / `tag` inputs; values are unchanged.)
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - run: swift --version
      - name: Install WebView2 SDK + WIL (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Add WebView2 / WIL to INCLUDE / LIB
        shell: pwsh
        run: |
          $webview2Inc = "$pwd\packages\Microsoft.Web.WebView2\build\native\include"
          $wilInc      = "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include"
          $webview2Lib = "$pwd\packages\Microsoft.Web.WebView2\build\native\x64"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$webview2Inc;$wilInc;$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$webview2Lib;$env:LIB"
      - name: Build (release)
        run: swift build -c release
      - name: Build (debug + test targets)
        # `swift test` drops back to the debug configuration regardless
        # of the prior release build, which on Windows means a from-
        # scratch rebuild of swift-crypto's BoringSSL (~hundreds of
        # clang invocations). `--build-tests` compiles both the package
        # libraries and the test bundles in one pass outside the test
        # step's 5-min timer.
        #
        # We keep `--build-tests` even though we don't *run* SwiftPM's
        # test bundles on Windows (see next step) — it's still the
        # cheapest way to compile-check the cross-platform test suites
        # against the Windows toolchain.
        run: swift build --build-tests
      - name: Test (SwiftPWAWindowsTestRunner)
        # Why an executable instead of `swift test`: SwiftPM's
        # swift-testing discovery build plugin emits 0-byte stubs for
        # every suite on Windows (verified locally on Swift 6.1.2 and
        # 6.3.1, both x64 and arm64), so the test bundle finds zero
        # tests at runtime and `swift test` exits 1 with no stderr.
        # `--list-tests` / `--dump-tests-json` hang on the same path,
        # which is what surfaced as `error: abnormal(312)` in CI when
        # `--filter` was in play. `--disable-xctest` doesn't help: the
        # swift-testing pass also finds zero tests because the
        # discovery sections aren't populated.
        #
        # SwiftPWAWindowsTestRunner re-expresses the WindowsUpdater
        # coverage as a plain executable with a small assertion harness
        # so we get real signal on every push. See
        # docs/windows-setup.md "Known limitations" for the long form.
        # 12-min timeout matches the linux-gtk3 rationale: even after
        # `--build-tests`, `swift run` still does an incremental link
        # pass and Windows runners are slow.
        timeout-minutes: 12
        run: swift run SwiftPWAWindowsTestRunner

  android:
    # Android Gradle-scaffold smoke test on Examples/HelloPWA: generate the
    # Gradle project (bundler codegen) and build it with `assembleDebug`.
    #
    # This deliberately does NOT run the Swift Android cross-compile
    # (`--cross-compile-android`). That path needs the swift-android-sdk, which
    # does not reliably produce a native `.so` on the GitHub `ubuntu-24.04`
    # runner — an elusive `missing required module 'SwiftAndroid'` that does not
    # reproduce on a real Linux box or on device (all observable SDK/toolchain/
    # clang state is identical). Attempting it here previously shipped a *hollow*
    # APK behind a green check for months. So the job verifies what the runner
    # can do reliably; the native cross-compile is device-verified (Galaxy Tab
    # S10+) and guarded for local/user builds by `--cross-compile-android`'s
    # hard-fail-on-skipped-ABI (see AndroidBundler). Restore the cross-compile
    # step if the runner story improves.
    runs-on: ubuntu-24.04
    needs: macos
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift toolchain runtime deps
        # `ubuntu-24.04` images don't preinstall libcurl4-openssl-dev,
        # and swiftly's post-install dependency check exits non-zero
        # without it — even though the toolchain itself extracts fine.
        # libsecret-1-dev: building the host CLI compiles SwiftPWACore, which
        # pulls the CSecretShim/CLibSecret libsecret dep on Linux.
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsecret-1-dev
      - name: Install Swiftly
        # Swiftly is the canonical way to install pinned Swift
        # toolchains on Linux — `swift-actions/setup-swift` doesn't
        # publish 6.2.x point-releases, and the Swift Android SDK 6.2
        # requires the matching 6.2.0 compiler (.swiftmodule format
        # isn't ABI-stable across patch releases yet).
        run: |
          curl -fsSL https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz | tar -xz
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
      - name: Install Swift 6.2.0
        run: |
          swiftly install 6.2.0
          swiftly use 6.2.0
          swift --version
      - name: Set up JDK 17
        # AGP 8.5 requires JDK 17 (Java 21 trips a "no toolchain
        # found" warning under AGP 8.5; AGP 8.7+ relaxes the
        # constraint, but we pin AGP 8.5 in the scaffold so the
        # workflow follows that pin).
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build swift-pwa CLI (host toolchain)
        run: swift build --product swift-pwa
      - name: Emit Gradle scaffold + assembleDebug (scaffold smoke test)
        # Scaffold-only: generate the Gradle project and build it, WITHOUT the
        # Swift Android cross-compile. The cross-compile requires the
        # swift-android-sdk, which does not reliably build a native `.so` on the
        # GitHub `ubuntu-24.04` runner (an elusive `missing required module
        # 'SwiftAndroid'` that does NOT reproduce on a real Linux box or on
        # device — everything observable about the SDK/toolchain/clang wiring is
        # identical). Rather than ship a hollow APK behind a green check (which
        # is what the `--cross-compile-android` path silently did for months),
        # this job verifies what the runner *can* do reliably — bundler codegen
        # + `aapt2`/`d8` via Gradle. The real native cross-compile is covered by
        # `--cross-compile-android`'s hard-fail (see AndroidBundler) for local /
        # user builds and is verified on-device (device-verified on a Galaxy Tab
        # S10+; a cold build also succeeds on the project's Linux box). If the
        # runner story improves, restore `--cross-compile-android` here.
        # Cross-compile is off by default (no --cross-compile-android), so the
        # bundler emits the scaffold with empty jniLibs/ — exactly the
        # scaffold-only smoke test we want here.
        run: |
          cd Examples/HelloPWA
          swift run --package-path ../.. swift-pwa build --target android
      - name: Run gradle assembleDebug
        # The vendored Gradle wrapper bootstraps Gradle 8.10.2 on
        # first run; subsequent runs are cache hits. JAVA_HOME is
        # picked up from the setup-java step.
        run: |
          cd Examples/HelloPWA/build/HelloPWA-android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists
        run: |
          APK=Examples/HelloPWA/build/HelloPWA-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || (echo "no APK at $APK" && exit 1)
          ls -lh "$APK"
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: HelloPWA-debug-apk
          path: Examples/HelloPWA/build/HelloPWA-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Pin swiftformat to a specific release rather than `brew install
      # swiftformat` (which tracks latest) so the lint is reproducible: an
      # unpinned upgrade that adds/enables a new default rule (e.g.
      # wrapIfStatementBodies) would otherwise fail the whole repo on an
      # unrelated PR. Bump this in lockstep with a `swiftformat .` reformat.
      - name: Install swiftformat
        env:
          SWIFTFORMAT_VERSION: 0.61.1
        run: |
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo mv /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          sudo chmod +x /usr/local/bin/swiftformat
          /usr/local/bin/swiftformat --version
      - name: Lint
        run: /usr/local/bin/swiftformat --lint .
