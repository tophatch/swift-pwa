name: llama linux

# Build the prebuilt llama.cpp Linux static lib (libllama.a, Vulkan GPU backend)
# that `SwiftPWALlama` links on Linux, and publish it as a STABLE release asset.
#
# The off-Apple analogue of llama-xcframework.yml. Run manually
# (workflow_dispatch) only when the pinned llama.cpp commit in
# Scripts/build-llama-linux.sh changes — the artifact depends on that commit,
# NOT on the swift-pwa version, so it lives on its own long-lived
# `llama-vendor-linux-x86_64` release.
#
# Self-completing: after building + publishing libllama.a, it pins the new
# SHA-256 into `LlamaLinuxArtifact.sha256_x86_64` (the CLI downloader's pin) and
# opens a PR. So the operation is "Run workflow" → merge the PR it opens.
#
# NOTE: workflow_dispatch only appears once this file is on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest # x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Vulkan SDK (LunarG tarball)
        # The SDK provides SPIRV-Headers' cmake config + glslc, which ggml's
        # Vulkan backend needs at configure/build — system libvulkan-dev alone is
        # not enough. The tarball is Ubuntu-version-independent (unlike the apt
        # repo), matching the path verified on the dev box.
        run: |
          mkdir -p "$HOME/vulkan-sdk"
          curl -fsSL -o /tmp/vulkan_sdk.tar.xz "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz"
          tar -C "$HOME/vulkan-sdk" -xf /tmp/vulkan_sdk.tar.xz
          SDK_DIR="$(find "$HOME/vulkan-sdk" -maxdepth 1 -name '1.*' -type d | head -1)"
          echo "SDK at $SDK_DIR"

      - name: Build libllama.a (Vulkan, static)
        id: build
        run: |
          SDK_DIR="$(find "$HOME/vulkan-sdk" -maxdepth 1 -name '1.*' -type d | head -1)"
          # shellcheck disable=SC1091
          set +u; . "$SDK_DIR/setup-env.sh"; set -u
          bash Scripts/build-llama-linux.sh
          asset="Vendor/llama-linux/libllama-linux-x86_64.a"
          echo "sha256=$(sha256sum "$asset" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish to the stable llama-vendor-linux-x86_64 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-vendor-linux-x86_64
          name: llama.cpp Linux static lib (Vulkan, vendored)
          prerelease: true
          files: ${{ steps.build.outputs.asset }}

      - name: Pin the checksum in LlamaLinuxArtifact.swift
        # Replace the CLI downloader's pinned x86_64 checksum. The value is the
        # sha256 of the exact file just uploaded, so the pin matches by
        # construction — no CI re-verification needed.
        run: |
          sed -i -E 's/(static let sha256_x86_64 = )"[0-9a-f]{64}"/\1"${{ steps.build.outputs.sha256 }}"/' \
            Sources/SwiftPWACLISupport/LlamaLinuxArtifact.swift
          echo "::notice::Pinned LlamaLinuxArtifact.sha256_x86_64 = ${{ steps.build.outputs.sha256 }}"

      - name: Open PR with the pinned checksum
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/pin-llama-linux-checksum
          title: "chore(ai): pin llama Linux libllama.a checksum"
          commit-message: |
            chore(ai): pin llama Linux libllama.a checksum

            Auto-generated by the llama-linux workflow after publishing libllama.a
            to the llama-vendor-linux-x86_64 release. The checksum is of the exact
            uploaded artifact, so it matches by construction.

            Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>
          body: |
            Pins `LlamaLinuxArtifact.sha256_x86_64` (the CLI downloader's pin) to
            the artifact just published to the `llama-vendor-linux-x86_64` release
            by the **llama-linux** workflow.

            - checksum: `${{ steps.build.outputs.sha256 }}`
            - url: `https://github.com/${{ github.repository }}/releases/download/llama-vendor-linux-x86_64/libllama-linux-x86_64.a`

            Correct by construction (the checksum is of the exact uploaded file).

            > Note: PRs opened by `GITHUB_TOKEN` don't trigger `on: pull_request`
            > workflows — push an empty commit if you want CI to run before merge.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: automated
