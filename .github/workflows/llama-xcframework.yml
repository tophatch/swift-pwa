name: llama xcframework

# Build the prebuilt llama.cpp xcframework that `SwiftPWALlama` consumes via
# `.binaryTarget`, and publish it as a STABLE release asset.
#
# Run this manually (workflow_dispatch) only when the pinned llama.cpp commit
# in Scripts/build-llama-xcframework.sh changes — the artifact depends on that
# commit, NOT on the swift-pwa version, so it lives on its own long-lived
# `llama-vendor` release rather than being rebuilt for every `v*` tag.
#
# It is self-completing: after building + publishing the xcframework, it pins
# the new SHA-256 into the `CLlama` binaryTarget in Package.swift and opens a
# PR with the change (the `url:` is stable and already points here). So the
# entire operation is "Run workflow" → merge the PR it opens.
#
# NOTE: workflow_dispatch only appears once this file is on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build xcframework (macOS + iOS + iOS-sim)
        run: bash Scripts/build-llama-xcframework.sh macos ios ios-sim
      - name: Compute checksum
        id: sum
        run: echo "sha256=$(swift package compute-checksum Vendor/llama/llama.xcframework.zip)" >> "$GITHUB_OUTPUT"
      - name: Publish to the stable llama-vendor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-vendor
          name: llama.cpp xcframework (vendored)
          prerelease: true
          files: Vendor/llama/llama.xcframework.zip
      - name: Pin the checksum in Package.swift
        # Replace the CLlama binaryTarget's checksum (the only 64-hex checksum
        # in the manifest, placeholder or previously-pinned). The value is
        # computed from the exact zip just uploaded, so the pin matches by
        # construction — no CI re-verification needed.
        run: |
          sed -i '' -E 's/checksum: "[0-9a-f]{64}"/checksum: "${{ steps.sum.outputs.sha256 }}"/' Package.swift
          echo "::notice::Pinned CLlama checksum = ${{ steps.sum.outputs.sha256 }}"
      - name: Open PR with the pinned checksum
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/pin-llama-checksum
          title: "chore(ai): pin llama xcframework checksum"
          commit-message: |
            chore(ai): pin llama xcframework checksum

            Auto-generated by the llama-xcframework workflow after publishing the
            xcframework to the llama-vendor release. The checksum is computed
            from the exact uploaded artifact, so it matches by construction.

            Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>
          body: |
            Pins the `CLlama` binaryTarget `checksum:` in `Package.swift` to the
            artifact just published to the `llama-vendor` release by the
            **llama-xcframework** workflow.

            - checksum: `${{ steps.sum.outputs.sha256 }}`
            - url: `https://github.com/${{ github.repository }}/releases/download/llama-vendor/llama.xcframework.zip`

            Correct by construction (the checksum is of the exact uploaded zip).

            > Note: PRs opened by `GITHUB_TOKEN` don't trigger `on: pull_request`
            > workflows — push an empty commit if you want CI to run before merge.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: automated
