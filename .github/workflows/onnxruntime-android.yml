name: onnxruntime android

# Vendor the ONNX Runtime Android C API + arm64-v8a libonnxruntime.so (via
# Scripts/vendor-onnxruntime-android.sh) and publish it as a STABLE release
# asset — the Android analogue of onnxruntime-xcframework.yml / llama-linux.yml.
# `OnnxRuntimeAndroidArtifact.swift` is the CLI-side consumer: it downloads this
# asset per ABI and verifies the checksum, so after a run, hand-carry the
# printed checksum (and version) into that file.
#
# The asset name carries the ONNX Runtime version, so a bump publishes a new
# asset beside the old one instead of replacing bytes that an already-released
# swift-pwa pins by checksum.
#
# Run this manually (workflow_dispatch) only when the pinned ONNX Runtime
# version in Scripts/vendor-onnxruntime-android.sh changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vendor the Android artifact (headers + arm64-v8a .so)
        id: build
        run: |
          bash Scripts/vendor-onnxruntime-android.sh
          asset="$(ls Vendor/onnxruntime-android/libonnxruntime-android-arm64-v8a-*.so)"
          echo "sha256=$(sha256sum "$asset" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Publish to the stable onnxruntime-vendor-android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onnxruntime-vendor-android
          name: ONNX Runtime Android arm64-v8a libonnxruntime.so (vendored)
          prerelease: true
          files: ${{ steps.build.outputs.asset }}
      - name: Report the checksum to hand-carry into the CLI resolver
        run: |
          name="$(basename "${{ steps.build.outputs.asset }}")"
          echo "::notice::$name sha256 = ${{ steps.build.outputs.sha256 }}"
          {
            echo "### ONNX Runtime Android artifact published"
            echo
            echo "- asset: \`$name\`"
            echo "- sha256: \`${{ steps.build.outputs.sha256 }}\`"
            echo "- url: \`https://github.com/${{ github.repository }}/releases/download/onnxruntime-vendor-android/$name\`"
            echo
            echo "Pin this into \`OnnxRuntimeAndroidArtifact.swift\` (\`version\` +"
            echo "\`sha256ByABI\`)."
          } >> "$GITHUB_STEP_SUMMARY"
