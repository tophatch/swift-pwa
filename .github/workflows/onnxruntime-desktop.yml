name: onnxruntime desktop

# Re-host Microsoft's official prebuilt ONNX Runtime **desktop** (Linux x64 +
# Windows x64, CPU build) as STABLE swift-pwa release assets, so the CLI's
# OnnxRuntime{Linux,Windows}Artifact resolvers fetch from a URL we control
# (matching how llama-{linux,windows}.yml and onnxruntime-android.yml publish).
# Both artifacts are just downloads of Microsoft's release archives, so a
# single ubuntu runner vendors both (the vendor scripts are host-independent —
# only *linking* against the result needs the matching OS).
#
# Run manually (workflow_dispatch) only when the pinned ONNX Runtime version in
# Scripts/vendor-onnxruntime-{linux,windows}.sh changes; then update the pinned
# version + checksums in the two CLI resolvers to the ones this prints. Asset
# names carry the ONNX Runtime version, so a bump ADDS assets to these releases
# instead of replacing bytes that already-tagged swift-pwa versions pin.
#
# Order matters for one shared output: both vendor scripts write the committed
# `Vendor/onnxruntime-desktop-headers/`, and the two releases' copies are not
# byte-identical (the Windows zip ships CRLF headers plus the training headers
# the Linux tarball drops). Windows runs last here, so the committed set is the
# Windows one — regenerate it with Scripts/vendor-onnxruntime-windows.sh, or the
# diff is every line of every header.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vendor Linux x86_64 libonnxruntime.so
        id: linux
        run: |
          bash Scripts/vendor-onnxruntime-linux.sh
          asset="$(ls Vendor/onnxruntime-desktop/linux-x86_64/libonnxruntime-linux-x86_64-*.so)"
          echo "sha256=$(sha256sum "$asset" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Publish to onnxruntime-vendor-linux
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onnxruntime-vendor-linux
          name: ONNX Runtime Linux x86_64 libonnxruntime.so (vendored, CPU)
          prerelease: true
          files: ${{ steps.linux.outputs.asset }}

      # arm64 before x64: both write the committed headers (byte-identical
      # today), and x64 is the set this workflow has always left behind.
      - name: Vendor Windows arm64 + x64 onnxruntime.dll + onnxruntime.lib
        id: windows
        run: |
          ARCH=arm64 bash Scripts/vendor-onnxruntime-windows.sh
          ARCH=x64 bash Scripts/vendor-onnxruntime-windows.sh
      - name: Publish to onnxruntime-vendor-windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onnxruntime-vendor-windows
          name: ONNX Runtime Windows x64 + arm64 onnxruntime.dll + .lib (vendored, CPU)
          prerelease: true
          files: |
            Vendor/onnxruntime-desktop/windows-x86_64/onnxruntime-*.dll
            Vendor/onnxruntime-desktop/windows-x86_64/onnxruntime-*.lib
            Vendor/onnxruntime-desktop/windows-arm64/onnxruntime-*.dll
            Vendor/onnxruntime-desktop/windows-arm64/onnxruntime-*.lib

      - name: Report checksums to pin into the CLI resolvers
        run: |
          lin="$(ls Vendor/onnxruntime-desktop/linux-x86_64/libonnxruntime-linux-x86_64-*.so)"
          wfiles="$(ls Vendor/onnxruntime-desktop/windows-{x86_64,arm64}/onnxruntime-*.{dll,lib})"
          {
            echo "### ONNX Runtime desktop artifacts published"
            echo
            echo "Pin these into OnnxRuntimeLinuxArtifact.swift / OnnxRuntimeWindowsArtifact.swift:"
            echo
            for f in "$lin" $wfiles; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | awk '{print $1}')\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
