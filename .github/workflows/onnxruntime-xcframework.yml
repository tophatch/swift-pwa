name: onnxruntime xcframework

# Repackage Microsoft's official ONNX Runtime Apple xcframework (via
# Scripts/vendor-onnxruntime-apple.sh) into the shape `SwiftPWAONNXRuntimeSmoke`
# — and, later, a real segmentation backend — consumes via `.binaryTarget`, and
# publish it as a STABLE release asset. Mirrors llama-xcframework.yml exactly.
#
# Run this manually (workflow_dispatch) only when the pinned ONNX Runtime
# version in Scripts/vendor-onnxruntime-apple.sh changes — the artifact depends
# on that version, NOT on the swift-pwa version, so it lives on its own
# long-lived `onnxruntime-vendor` release rather than being rebuilt for every
# `v*` tag.
#
# It is self-completing: after building + publishing the xcframework, it pins
# the new SHA-256 into the `ONNXRuntime` binaryTarget in Package.swift and
# opens a PR with the change (the `url:` is stable and already points here).
# So the entire operation is "Run workflow" → merge the PR it opens.
#
# NOTE: workflow_dispatch only appears once this file is on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Repackage the xcframework (macOS + iOS + iOS-sim)
        run: bash Scripts/vendor-onnxruntime-apple.sh
      - name: Compute checksum
        id: sum
        run: echo "sha256=$(swift package compute-checksum Vendor/onnxruntime/onnxruntime.xcframework.zip)" >> "$GITHUB_OUTPUT"
      - name: Publish to the stable onnxruntime-vendor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onnxruntime-vendor
          name: ONNX Runtime xcframework (vendored, Apple)
          prerelease: true
          files: Vendor/onnxruntime/onnxruntime.xcframework.zip
      - name: Pin the checksum in Package.swift
        # Replace the ONNXRuntime binaryTarget's checksum specifically —
        # scoped to the line following its `url:` (Package.swift has more
        # than one `.binaryTarget` with a 64-hex checksum, e.g. CLlama's, so
        # an unscoped replace would clobber the wrong one). The value is
        # computed from the exact zip just uploaded, so the pin matches by
        # construction — no CI re-verification needed.
        run: |
          sed -i '' -E '/onnxruntime\.xcframework\.zip/{N;s/checksum: "[0-9a-f]{64}"/checksum: "${{ steps.sum.outputs.sha256 }}"/;}' Package.swift
          echo "::notice::Pinned ONNXRuntime checksum = ${{ steps.sum.outputs.sha256 }}"
      - name: Open PR with the pinned checksum
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/pin-onnxruntime-checksum
          title: "chore(ai): pin ONNX Runtime xcframework checksum"
          commit-message: |
            chore(ai): pin ONNX Runtime xcframework checksum

            Auto-generated by the onnxruntime-xcframework workflow after publishing
            the xcframework to the onnxruntime-vendor release. The checksum is
            computed from the exact uploaded artifact, so it matches by
            construction.

            Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          body: |
            Pins the `ONNXRuntime` binaryTarget `checksum:` in `Package.swift` to
            the artifact just published to the `onnxruntime-vendor` release by the
            **onnxruntime-xcframework** workflow.

            - checksum: `${{ steps.sum.outputs.sha256 }}`
            - url: `https://github.com/${{ github.repository }}/releases/download/onnxruntime-vendor/onnxruntime.xcframework.zip`

            Correct by construction (the checksum is of the exact uploaded zip).

            > Note: PRs opened by `GITHUB_TOKEN` don't trigger `on: pull_request`
            > workflows — push an empty commit if you want CI to run before merge.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: automated
