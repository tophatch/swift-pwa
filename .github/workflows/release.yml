name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  cli-binaries:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: swift-pwa-macos-arm64
          - os: macos-15
            arch: x86_64
            artifact: swift-pwa-macos-x86_64
          - os: ubuntu-24.04
            arch: x86_64
            artifact: swift-pwa-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Swift (Linux only)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build CLI
        run: swift build -c release --product swift-pwa
      - name: Stage binary
        run: |
          mkdir dist
          cp .build/release/swift-pwa dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: cli-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
