name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  cli-binaries:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: swift-pwa-macos-arm64
          - os: macos-15
            arch: x86_64
            artifact: swift-pwa-macos-x86_64
          - os: ubuntu-24.04
            arch: x86_64
            artifact: swift-pwa-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Swift (Linux only)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          # 6.2 floor on Linux, not 6.0: the GTK4 backend does not render
          # under 6.0.3 — the app comes up on about:blank because the custom
          # `pwa://` scheme handler is never invoked, silently and with no
          # error. Verified on a real GTK4 box: same commit, body 0 under
          # 6.0.3 and a fully loaded page under 6.2 / 6.3.1. Keep this in step
          # with `.swift-version`, which swiftly honours inside the checkout.
          swift-version: "6.2"
      - name: Install libsecret (Linux only)
        # Building the CLI compiles SwiftPWACore, which pulls the
        # CSecretShim/CLibSecret libsecret dep on Linux (secrets.* store).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Build CLI
        run: swift build -c release --product swift-pwa
      - name: Stage binary
        run: |
          mkdir dist
          cp .build/release/swift-pwa dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  cli-binary-windows:
    # Windows is its own job because the build steps don't fit the
    # POSIX matrix shape — we need MSVC + Swift-for-Windows + the
    # WebView2 / WIL NuGet packages on INCLUDE/LIB before swift build
    # will resolve `CWebView2Shim`. (The `swift-pwa` CLI itself
    # doesn't *call* into the Windows backend, but SwiftPM compiles
    # every target in the package graph — so the C++ shims have to
    # build for the CLI link step to succeed.)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          # 6.3.1, NOT the 6.1.2 the CI jobs pin. Foundation's file writing is
          # broken on Windows in 6.1.2, and it broke the *shipped* CLI rather
          # than the build: `swift-pwa init` died with an access violation
          # (0xC0000005) writing no files at all, and `drive shot` reported
          # "Wrote … (419738 bytes)" while leaving 6 zero bytes on disk. Both
          # were reproduced against this published binary and both are correct
          # when the same commit is built in release mode with 6.3.1, on the
          # same machine — so it is the toolchain, not the configuration and not
          # our code. Nothing in CI caught it because CI never *runs* the
          # Windows binary it builds.
          #
          # Keep this at or above the Swift the Windows verify box uses, and
          # bump the CI jobs with it rather than letting them drift apart —
          # a toolchain we don't ship is a toolchain whose bugs we don't see.
          # `swift-version` / `swift-build` replaced the deprecated
          # `branch` / `tag` inputs.
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - name: Install WebView2 SDK + WIL (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion
      - name: Add WebView2 / WIL to INCLUDE / LIB
        shell: pwsh
        run: |
          $webview2Inc = "$pwd\packages\Microsoft.Web.WebView2\build\native\include"
          $wilInc      = "$pwd\packages\Microsoft.Windows.ImplementationLibrary\include"
          $webview2Lib = "$pwd\packages\Microsoft.Web.WebView2\build\native\x64"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$webview2Inc;$wilInc;$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$webview2Lib;$env:LIB"
      - name: Build CLI
        run: swift build -c release --product swift-pwa
      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path .build\release\swift-pwa.exe -Destination dist\swift-pwa-windows-x86_64.exe
      - name: Smoke-test the staged binary
        # Run the exact bytes we're about to publish. Compiling and linking is
        # not evidence that the artifact works, and twice now it wasn't: the
        # v0.9.6 Windows CLI shipped crashing on `init` (access violation,
        # nothing written) and silently truncating `drive shot` output to 6
        # bytes, both from the toolchain, through a fully green build.
        #
        # `init` is the right probe because it only writes files — no network,
        # no git, no device — so it exercises the path that broke, and asserting
        # the files exist *and* have plausible sizes catches a silent truncation
        # as well as a crash. A CLI that can't scaffold an app is not shippable.
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\swift-pwa-windows-x86_64.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }

          $tmp = Join-Path $env:RUNNER_TEMP "cli-smoke"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Push-Location $tmp
          & $exe init SmokeApp
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "init exited $code (0xC0000005 = access violation)" }

          foreach ($rel in @('Package.swift', 'pwa.json', 'web\index.html', 'Sources\SmokeApp\App.swift')) {
            $p = Join-Path $tmp "SmokeApp\$rel"
            if (-not (Test-Path $p)) { throw "init reported success but did not write $rel" }
            $len = (Get-Item $p).Length
            if ($len -lt 64) { throw "$rel is only $len bytes — a truncated write" }
            Write-Host ("ok  {0,-34} {1} bytes" -f $rel, $len)
          }
          Write-Host "staged CLI runs and writes files correctly"
      - uses: actions/upload-artifact@v7
        with:
          name: swift-pwa-windows-x86_64
          path: dist/swift-pwa-windows-x86_64.exe

  release:
    needs: [cli-binaries, cli-binary-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
