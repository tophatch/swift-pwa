<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Prompt-to-image · Critter Facts</title>
    <style>
        :root {
            --bg: #0e1116; --ink: #e9eef5; --muted: #8b97a7; --accent: #5fd0a0;
            --accent-ink: #06231a; --line: #232a35; --card: #171c24;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; }
        body {
            background: var(--bg); color: var(--ink);
            font: 15px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column;
        }
        .bar {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-bottom: 1px solid var(--line); background: #131820;
            padding-top: calc(12px + env(safe-area-inset-top));
        }
        .back {
            text-decoration: none; color: var(--ink); font-weight: 700;
            border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
        }
        .back:active { transform: translateY(1px); }
        .hint { color: var(--muted); font-size: 13px; flex: 1; }
        .hint b { color: var(--accent); }
        select.model {
            font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
            border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 52vw;
        }
        select.model:focus { outline: none; border-color: var(--accent); }

        .stage {
            position: relative; flex: 1; min-height: 0; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }
        .frame {
            width: min(512px, 90vw); aspect-ratio: 1 / 1; border-radius: 16px;
            border: 1px solid var(--line); background: var(--card);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .frame .placeholder { color: var(--muted); font-size: 48px; }

        .controls {
            display: flex; gap: 10px; padding: 12px 16px;
            border-top: 1px solid var(--line); background: #131820;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        input[type="text"] {
            flex: 1; font: inherit; color: var(--ink); background: var(--bg);
            border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent); }
        button {
            appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700;
            background: var(--accent); color: var(--accent-ink);
            padding: 12px 20px; border-radius: 12px; transition: transform .06s ease, opacity .2s;
        }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: 0.5; cursor: progress; }

        .overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; padding: 24px;
            background: rgba(14,17,22,0.78); text-align: center;
        }
        .overlay small { color: var(--muted); max-width: 44ch; }
        progress { width: min(320px, 70vw); height: 8px; accent-color: var(--accent); }
        .spinner {
            width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid var(--line); border-top-color: var(--accent);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .err { color: #f0c9c9; max-width: 44ch; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="bar">
        <a class="back" href="index.html">← Back</a>
        <select class="model" id="model" title="Image model" hidden></select>
        <div class="hint" id="hint">Type a <b>prompt</b> and generate an image — on-device.</div>
    </div>

    <div class="stage">
        <div class="frame">
            <img id="out" alt="generated image" hidden />
            <div class="placeholder" id="placeholder">🎨</div>
        </div>
        <div class="overlay" id="overlay" hidden>
            <div class="spinner" id="spinner" hidden></div>
            <div id="status">Loading…</div>
            <progress id="bar" max="1" value="0" hidden></progress>
            <small id="sub"></small>
        </div>
    </div>

    <form class="controls" id="form">
        <input type="text" id="prompt" placeholder="a red panda astronaut, digital art"
            value="a red panda astronaut floating in space, digital art" autocomplete="off" />
        <button type="submit" id="go" disabled>Generate</button>
    </form>

    <!-- Shown only when the selected model needs setup (a cloud model with no
         API key yet). Save stores the key in the OS secure store via secrets.set,
         then the model flips to `ready` and the prompt controls return. -->
    <form class="controls" id="keyform" hidden>
        <input type="password" id="apikey" placeholder="Paste your Google AI API key" autocomplete="off" />
        <button type="submit" id="savekey">Save key</button>
    </form>

    <script>
        const $ = (id) => document.getElementById(id);
        const bridge = window.__SWIFT_PWA__;
        let busy = false;
        // Which models' weights are already fetched this session, keyed by id —
        // the switcher offers several, each downloaded on first use.
        const ready = new Set();
        let models = [];          // the image-generation models from ai.info
        let current = null;       // the selected model id

        function showSpinner(text, sub = "") {
            $("overlay").hidden = false; $("spinner").hidden = false;
            $("bar").hidden = true; $("status").textContent = text; $("sub").textContent = sub;
        }
        function showProgress(text, sub = "") {
            $("overlay").hidden = false; $("spinner").hidden = true;
            $("bar").hidden = false; $("status").textContent = text; $("sub").textContent = sub;
        }
        function hideOverlay() { $("overlay").hidden = true; }
        function showError(msg) {
            $("overlay").hidden = false; $("spinner").hidden = true; $("bar").hidden = true;
            $("status").innerHTML = '<div class="err">⚠️ ' + msg + "</div>"; $("sub").textContent = "";
        }

        const mb = (n) => (n / 1048576).toFixed(0);
        const modelByID = (id) => models.find((m) => m.id === id);
        const availabilityOf = (id) => (modelByID(id) || {}).availability || {};
        // Must match the Swift side's `imagenAPIKeyName` (CritterFacts.swift).
        const SECRET_KEY_NAME = "google-ai";

        // Reflect the selected model's licence + download size under the bar,
        // so the trade-off the user is switching on is visible.
        function showModelMeta() {
            const m = modelByID(current);
            if (!m) return;
            const av = m.availability || {};
            if (av.kind === "needsSetup") {
                $("hint").innerHTML = `🔑 ${av.reason || "This model needs setup"}.`;
                return;
            }
            const size = av.kind === "downloadable" && av.bytes ? ` · ~${mb(av.bytes)} MB` : "";
            const lic = m.license ? ` · ${m.license}` : "";
            const where = m.offlineCapable ? "on-device" : "cloud";
            let extra = "";
            // A cloud model that's `ready` has a stored key — offer to clear it.
            if (!m.offlineCapable && av.kind === "ready") {
                extra = ' · <a href="#" id="clearkey" style="color:var(--muted)">clear key</a>';
            }
            $("hint").innerHTML =
                `Prompt → image, ${where}.<span style="color:var(--muted)">${lic}${size}${extra}</span>`;
            const clear = $("clearkey");
            if (clear) clear.addEventListener("click", (e) => { e.preventDefault(); clearKey(); });
        }

        // Show the prompt controls or the key-entry form depending on whether the
        // selected model is usable now (`ready` / `downloadable`) or needs a key
        // (`needsSetup`). This is the whole point of the demo: a cloud model
        // advertises `needsSetup` until a key is stored, then flips to `ready`.
        function applyModelState() {
            showModelMeta();
            const needsKey = availabilityOf(current).kind === "needsSetup";
            $("form").hidden = needsKey;
            $("keyform").hidden = !needsKey;
            $("go").disabled = needsKey || busy;
            if (needsKey) $("apikey").focus();
        }

        // First use of a given model downloads its weights (LCM ~2.0 GB / SD-Turbo
        // ~2.5 GB) from the sd-vendor release; the composite routes the chosen
        // `model` id to that Stable-Diffusion backend. Later runs are a cache hit.
        function ensureModel(id) {
            if (ready.has(id)) return Promise.resolve();
            // A "ready" model (a remote/cloud or LAN backend) has nothing to
            // download — skip the prepare step entirely. Only "downloadable"
            // models (the on-device weights) run the fetch below.
            const model = modelByID(id);
            if (model && model.availability && model.availability.kind === "ready") {
                ready.add(id);
                return Promise.resolve();
            }
            return new Promise((resolve, reject) => {
                showProgress("Preparing model…", "Downloading the image model (first run only)…");
                const unsub = bridge.subscribe("ai.ensureModel", { model: id }, (e) => {
                    if (e.type === "progress") {
                        if (e.totalBytes) {
                            $("bar").value = e.bytesDone / e.totalBytes;
                            $("sub").textContent = `Downloading ${id}… ${mb(e.bytesDone)} / ${mb(e.totalBytes)} MB`;
                        } else {
                            $("sub").textContent = `Downloading ${id}… ${mb(e.bytesDone)} MB`;
                        }
                    } else if (e.type === "done") {
                        ready.add(id); unsub(); resolve();
                    } else if (e.type === "error") {
                        unsub(); reject(new Error(e.message || "model download failed"));
                    }
                });
            });
        }

        async function generate(prompt) {
            if (busy || !current) return;
            busy = true; $("go").disabled = true; $("model").disabled = true;
            const id = current;
            try {
                await ensureModel(id);

                // Pass the chosen model id; the composite (MultiModelImageBackend)
                // routes it to the right Stable-Diffusion backend. Both are
                // few-step models — quick on a GPU, a few seconds on CPU.
                showSpinner("Generating…", `${modelByID(id)?.label || id} — a moment on CPU.`);
                const t0 = Date.now();
                const { images } = await bridge.invoke("ai.generateImage", { prompt, model: id });
                const secs = ((Date.now() - t0) / 1000).toFixed(1);
                const out = images && images[0];
                if (!out || !out.dataBase64) throw new Error("no image returned");

                $("out").src = "data:" + (out.mimeType || "image/png") + ";base64," + out.dataBase64;
                $("out").hidden = false; $("placeholder").hidden = true;
                $("hint").innerHTML = `Generated in ${secs}s (seed ${out.seed ?? 0}) · ${modelByID(id)?.label || id}.`;
                hideOverlay();

                // Proactively free the resident model now the image is shown.
                // On a memory-constrained device this returns the ~2 GB on-device
                // pipeline to the OS instead of holding it until the next model
                // switch; the next generate reloads it lazily. Remote backends
                // (Imagen / ComfyUI) cache nothing, so this is a no-op for them.
                // Fire-and-forget — a failed unload shouldn't disrupt the UI.
                bridge.invoke("ai.unload", {}).catch(() => {});
            } catch (e) {
                showError((e && e.message) || String(e));
            } finally {
                busy = false; $("go").disabled = false; $("model").disabled = false;
            }
        }

        $("form").addEventListener("submit", (e) => {
            e.preventDefault();
            const p = $("prompt").value.trim();
            if (p) generate(p);
        });

        $("model").addEventListener("change", () => { current = $("model").value; applyModelState(); });

        // Save the entered API key to the OS secure store, then re-fetch ai.info
        // — the model the app was advertising as `needsSetup` now reports `ready`
        // (its `apiKey` closure reads straight from the store), so the prompt
        // controls return and the user can generate. The key never touches the
        // page beyond this call; it lives in Keychain / Keystore.
        async function saveKey() {
            const key = $("apikey").value.trim();
            if (!key) return;
            $("savekey").disabled = true;
            try {
                await bridge.invoke("secrets.set", { key: SECRET_KEY_NAME, value: key });
                $("apikey").value = "";
                await refreshInfo();       // Imagen flips needsSetup → ready.
                applyModelState();
            } catch (e) {
                showError((e && e.message) || String(e));
            } finally {
                $("savekey").disabled = false;
            }
        }

        // Remove the stored key — the cloud model returns to `needsSetup`.
        async function clearKey() {
            try {
                await bridge.invoke("secrets.delete", { key: SECRET_KEY_NAME });
                await refreshInfo();
                applyModelState();
            } catch (e) {
                showError((e && e.message) || String(e));
            }
        }

        $("keyform").addEventListener("submit", (e) => { e.preventDefault(); saveKey(); });

        // Fetch ai.info and (re)populate the switcher. Preserves the current
        // selection across refreshes (e.g. after saving a key). Returns true if
        // image generation is available at all.
        async function refreshInfo() {
            const info = await bridge.invoke("ai.info", {});
            if (!info || !info.imageGeneration) {
                showError("On-device image generation isn't available in this build. " +
                    "Build with ai.local_onnx_runtime set (see the CritterFacts README).");
                return false;
            }
            // Filter to models that can do text→image (`image-generation`).
            // A commercial app would also filter by `license`.
            models = (info.models || []).filter(
                (m) => Array.isArray(m.capabilities) && m.capabilities.includes("image-generation")
            );
            const select = $("model");
            select.innerHTML = "";
            if (models.length > 1) {
                for (const m of models) {
                    const opt = document.createElement("option");
                    opt.value = m.id; opt.textContent = m.label || m.id;
                    select.appendChild(opt);
                }
                select.hidden = false;
            }
            // Keep the current selection if still present; else ai.info's active
            // model; else the first.
            const keep = models.find((m) => m.id === current);
            current = (keep || models.find((m) => m.id === info.model) || models[0] || {}).id || null;
            if (current) select.value = current;
            return true;
        }

        async function start() {
            try {
                if (await refreshInfo()) {
                    applyModelState();
                    hideOverlay();
                }
            } catch (e) {
                showError((e && e.message) || String(e));
            }
        }

        start();
    </script>
</body>
</html>
