<!doctype html>
<meta charset="utf-8">
<title>close flush check</title>
<body style="font:17px system-ui;padding:24px">
Close-flush check (#281). The script drives this page.
<script>
const bridge = window.__SWIFT_PWA__;
// A second window's copy of this page prefixes its markers, so the two can be
// told apart in one log.
const prefix = document.body.dataset.prefix || "";
const mark = (value) => bridge.invoke("probe.write", { value: prefix + value });

// Every way a page can hear it is going. A marker on disk from one of these
// is the only proof the page got to run.
bridge.subscribe("window.subscribe", {}, (event) => {
    if (event && event.type === "willClose") mark("willClose");
    if (event && event.type === "didResize" && !window.ready) becomeReady("ready");
});

// Ready, then whatever a phone harness asked for — it has no driver to ask.
function becomeReady(marker) {
    window.ready = true;
    mark(marker);
    bridge.invoke("probe.action", { value: prefix }).then((action) => {
        if (action === "quit") setTimeout(() => bridge.invoke("app.quit", {}), 500);
        if (action === "close") setTimeout(() => bridge.invoke("window.close"), 500);
        if (multiWindow[action]) prefix ? multiWindow[action].second() : multiWindow[action].first();
        // Android Back (#288): a history entry for Back to walk, or a route
        // for a relaunch to come back to.
        // On a tap: Chromium skips a history entry pushed without a user
        // gesture when going back, so a timer's push would never be reached.
        if (action === "push-history") addEventListener("click", () => {
            history.pushState({}, "", "?pushed=1");
            mark("pushed");
        }, { once: true });
        if (action === "replace-route") setTimeout(() => {
            sessionStorage.setItem("seen", "1");
            location.replace("index.html?restored=1");
        }, 500);
    }).catch(() => {});
}

// iPad multi-window rows (#287). The first window starts from one scene,
// does the row, and counts scenes; the second window's page (prefixed) plays
// its part.
const countScenes = (...times) => bridge.invoke("probe.countScenes", { value: times.join(",") });
const recordSessions = () => bridge.invoke("probe.sessions", null).then((s) => mark("sessions " + s));
const reset = () => bridge.invoke("probe.resetSessions", null);
const after = (ms, body) => new Promise((resolve) => setTimeout(resolve, ms)).then(body);
const multiWindow = {
    // The app opens a window; it closes itself.
    "second-window": {
        first: () => reset().then(() => after(1500, () => {
            bridge.invoke("probe.openScene", null);
            countScenes(3000, 9000);
        })),
        second: () => after(1000, () => bridge.invoke("window.close")),
    },
    // The app opens a window; the system takes its scene away.
    "system-close": {
        first: () => reset().then(() => after(1500, () => {
            bridge.invoke("probe.openScene", null);
            countScenes(3000, 9000);
        })),
        second: () => after(1000, () => bridge.invoke("probe.dropScene", null)),
    },
    // The system opens a window nobody asked for, then the first one closes it.
    "system-window": {
        first: () => reset().then(() => after(1500, () => {
            bridge.invoke("probe.systemScene", null);
            countScenes(4000);
            after(6000, reset);
        })),
        second: () => {},
    },
    // The app opens a window and leaves it, for the next launch to bring back.
    "keep-second": {
        first: () => reset().then(() => after(1500, () => {
            bridge.invoke("probe.openScene", null);
            countScenes(4000);
            after(5000, recordSessions);
        })),
        second: () => {},
    },
    // After a relaunch: what came back.
    "count": {
        first: () => { recordSessions(); countScenes(4000); after(6000, reset); },
        second: () => { recordSessions(); after(6000, reset); },
    },
};
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "hidden") return;
    mark("hidden");
    // What a mobile app does on going to the background, where there is no
    // pagehide: the runtime has to stay up for this to land.
    bridge.invoke("probe.slowWrite", { value: prefix + "hidden-slow" });
});
addEventListener("popstate", () => mark("popstate"));
// The replaced route, shown again by a new WebView (whose sessionStorage
// starts empty) after its Activity went.
if (location.search.includes("restored=1") && !sessionStorage.getItem("seen")) mark("restored");
addEventListener("pagehide", () => {
    mark("pagehide");
    bridge.invoke("probe.slowWrite", { value: prefix + "pagehide-slow" });
});

// `ready` once a resize has come back through the subscription, so a missing
// `willClose` can't be a subscription that never went live.
addEventListener("load", () => {
    bridge.invoke("window.setSize", { width: 640, height: 480 }).catch(() => {});
    setTimeout(() => { if (!window.ready) becomeReady("ready-no-resize"); }, 2000);
});
</script>
