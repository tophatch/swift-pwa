<!doctype html>
<meta charset="utf-8">
<title>close flush check</title>
<body style="font:17px system-ui;padding:24px">
Close-flush check (#281). The script drives this page.
<script>
const bridge = window.__SWIFT_PWA__;
// A second window's copy of this page prefixes its markers, so the two can be
// told apart in one log.
const prefix = document.body.dataset.prefix || "";
const mark = (value) => bridge.invoke("probe.write", { value: prefix + value });

// Every way a page can hear it is going. A marker on disk from one of these
// is the only proof the page got to run.
bridge.subscribe("window.subscribe", {}, (event) => {
    if (event && event.type === "willClose") mark("willClose");
    if (event && event.type === "didResize" && !window.ready) becomeReady("ready");
});

// Ready, then whatever a phone harness asked for — it has no driver to ask.
function becomeReady(marker) {
    window.ready = true;
    mark(marker);
    bridge.invoke("probe.action", null).then((action) => {
        if (action === "quit") setTimeout(() => bridge.invoke("app.quit", {}), 500);
        if (action === "close") setTimeout(() => bridge.invoke("window.close"), 500);
        // iPad multi-window: the first window opens a second, which closes
        // itself; the first counts scenes before and after.
        if (action === "second-window" && !prefix) {
            bridge.invoke("probe.openScene", null);
            [3000, 9000].forEach((t) => setTimeout(() => bridge.invoke("probe.sceneCount", null)
                .then((n) => mark("scenes-" + n)), t));
        }
        if (action === "second-window" && prefix) setTimeout(() => bridge.invoke("window.close"), 1000);
    }).catch(() => {});
}
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "hidden") return;
    mark("hidden");
    // What a mobile app does on going to the background, where there is no
    // pagehide: the runtime has to stay up for this to land.
    bridge.invoke("probe.slowWrite", { value: prefix + "hidden-slow" });
});
addEventListener("pagehide", () => {
    mark("pagehide");
    bridge.invoke("probe.slowWrite", { value: prefix + "pagehide-slow" });
});

// `ready` once a resize has come back through the subscription, so a missing
// `willClose` can't be a subscription that never went live.
addEventListener("load", () => {
    bridge.invoke("window.setSize", { width: 640, height: 480 }).catch(() => {});
    setTimeout(() => { if (!window.ready) becomeReady("ready-no-resize"); }, 2000);
});
</script>
