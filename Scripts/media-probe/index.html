<!doctype html>
<!--
  Served-media probe for Scripts/verify-served-media.sh (#349).

  Every way a page points a media element at a file the app serves, for one
  format at a time, plus a blob: control on the same bytes: a box without a
  decoder fails both, which says "no codec here" rather than "served media
  is broken". clip.* are 20 s, 32x24, VP8 + Opus and H.264 + AAC.
-->
<html>
<head>
<meta charset="utf-8">
<title>media probe</title>
</head>
<body>
<video id="markup-webm" src="clip.webm" muted preload="auto"></video>
<video id="source-webm" muted preload="auto"><source src="clip.webm" type="video/webm"></video>
<video id="markup-mp4" src="clip.mp4" muted preload="auto"></video>
<video id="source-mp4" muted preload="auto"><source src="clip.mp4" type="video/mp4"></video>
<script>
const TIMEOUT_MS = 15000;

function settle(el) {
    if (el.readyState >= 2) return Promise.resolve("canplay");
    // Markup elements can fail before anything is listening.
    if (el.error) return Promise.resolve("error " + el.error.code);
    return new Promise((resolve) => {
        const timer = setTimeout(() => resolve("timeout readyState=" + el.readyState), TIMEOUT_MS);
        el.addEventListener("canplay", () => { clearTimeout(timer); resolve("canplay"); }, { once: true });
        el.addEventListener("error", () => {
            clearTimeout(timer);
            resolve("error " + (el.error ? el.error.code : "?"));
        }, { once: true });
    });
}

function seeked(el, to) {
    return new Promise((resolve) => {
        const timer = setTimeout(() => resolve("timeout at " + el.currentTime.toFixed(1)), TIMEOUT_MS);
        el.addEventListener("seeked", () => { clearTimeout(timer); resolve(el.currentTime.toFixed(1)); }, { once: true });
        el.currentTime = to;
    });
}

function made(build) {
    const el = build();
    el.muted = true;
    el.preload = "auto";
    if (el.isConnected === false && !(el instanceof HTMLAudioElement)) document.body.append(el);
    return el;
}

// One format's results. Each value is "canplay" when it worked.
window.probeFormat = async (ext, type) => {
    const file = "clip." + ext;
    const out = {};
    const bytes = await (await fetch(file)).blob();
    out.blob = await settle(made(() => {
        const v = document.createElement("video");
        v.src = URL.createObjectURL(new Blob([bytes], { type }));
        return v;
    }));

    out.markup = await settle(document.getElementById("markup-" + ext));
    out.source = await settle(document.getElementById("source-" + ext));
    const prop = made(() => { const v = document.createElement("video"); v.src = file; return v; });
    out.property = await settle(prop);
    out.setAttribute = await settle(made(() => {
        const v = document.createElement("video");
        v.setAttribute("src", file);
        return v;
    }));
    const holder = document.createElement("div");
    holder.innerHTML = '<video muted preload="auto" src="' + file + '"></video>';
    document.body.append(holder);
    out.innerHTML = await settle(holder.firstChild);
    out.audio = await settle(made(() => new Audio(file)));

    // A seek near the end: with Range support it's a short request for the
    // tail of the file rather than a read of everything before it.
    out.seek = out.property === "canplay" ? await seeked(prop, 18) : "skipped";

    // The page sees its own URLs, as on every other platform.
    const v = document.getElementById("markup-" + ext);
    out.reads = [v.src, v.currentSrc, v.getAttribute("src")].join(" ");
    out.expectedReads = [new URL(file, location.href).href, new URL(file, location.href).href, file].join(" ");

    // A crossorigin frame must stay readable to the app.
    const cv = made(() => {
        const c = document.createElement("video");
        c.crossOrigin = "anonymous";
        c.src = file;
        return c;
    });
    out.canvas = await settle(cv);
    if (out.canvas === "canplay") {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 4;
        const g = canvas.getContext("2d");
        g.drawImage(cv, 0, 0, 4, 4);
        try { g.getImageData(0, 0, 1, 1); out.canvas = "readable"; } catch (e) { out.canvas = e.name; }
    }
    return out;
};
</script>
</body>
</html>
